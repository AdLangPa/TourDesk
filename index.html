function renderQuestionList() {
  const list = document.getElementById('q-list');
  if (!list) return;
  if (!editingEp.questions.length) {
    list.innerHTML = '<p style="color:var(--text-muted); font-style:italic; padding:14px 4px; font-size:13px;">No slides yet. Add one below.</p>';
    return;
  }
  list.innerHTML = editingEp.questions.map((q, i) => {
    // For content slides the "preview text" is heading or text body
    const previewText = isContentType(q.type)
      ? (q.heading || q.text || '(empty)')
      : (q.text || '(no text)');
    const typeLabel = isContentType(q.type)
      ? q.type.replace(/^content_/, '').replace(/_/g, ' ')
      : q.type.replace(/_/g, ' ');
    return `<div class="q-list-item ${q.id === editingQId ? 'active' : ''}${isContentType(q.type) ? ' is-content' : ''}" draggable="true" data-id="${escHtml(q.id)}" data-i="${i}">
      <span class="q-grip" title="Drag to reorder">⋮⋮</span>
      <span class="q-list-num">${i + 1}</span>
      <span class="q-list-text">${escHtml(previewText.slice(0, 40))}</span>
      <span class="q-list-type">${typeLabel}</span>
    </div>`;
  }).join('');
  list.querySelectorAll('.q-list-item').forEach(item => {
    item.addEventListener('click', () => {
      editingQId = item.dataset.id;
      renderQuestionList();
      renderQuestionEditor();
    });
    item.addEventListener('dragstart', e => {
      item.classList.add('dragging');
      e.dataTransfer.setData('text/plain', item.dataset.i);
      e.dataTransfer.effectAllowed = 'move';
    });
    item.addEventListener('dragend', () => item.classList.remove('dragging'));
    item.addEventListener('dragover', e => {
      e.preventDefault(); e.dataTransfer.dropEffect = 'move';
      item.classList.add('drag-over');
    });
    item.addEventListener('dragleave', () => item.classList.remove('drag-over'));
    item.addEventListener('drop', e => {
      e.preventDefault();
      item.classList.remove('drag-over');
      const from = parseInt(e.dataTransfer.getData('text/plain'), 10);
      const to = parseInt(item.dataset.i, 10);
      if (isNaN(from) || isNaN(to) || from === to) return;
      const [moved] = editingEp.questions.splice(from, 1);
      editingEp.questions.splice(to, 0, moved);
      renderQuestionList();
    });
  });
}

function addQuestion(type) {
  const q = makeBlankQuestion(type);
  editingEp.questions.push(q);
  editingQId = q.id;
  renderQuestionList();
  renderQuestionEditor();
}

function makeBlankQuestion(type) {
  const id = 'q_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const base = { id, type, text: '' };
  switch (type) {
    case 'two_choice': return { ...base, label: '', options: [{ text: '', pct: null }, { text: '', pct: null }], correct: 0 };
    case 'multiple_choice': return { ...base, options: [{ text: '', pct: null }, { text: '', pct: null }, { text: '', pct: null }, { text: '', pct: null }], correct: 0 };
    case 'over_under': return { ...base, number: 50, correct: 'over', actual: null, note: '' };
    case 'guess_pct': return { ...base, answer: null, note: '', source: '' };
    case 'name_as_many': return { ...base, prompt: '', answers: [], statLine: '', revealList: true, source: '' };
    case 'guess_breakdown': return { ...base, options: [{ label: '', pct: null }, { label: '', pct: null }], source: '' };
    case 'ranking': return { ...base, items: [{ name: '', stat: '' }, { name: '', stat: '' }, { name: '', stat: '' }], source: '' };
    case 'guess_data': return { ...base, text: '', answer: '', chartData: [] };
    case 'tiebreaker': return { ...base, text: '', answer: null, unit: '' };
    case 'higher_lower': return { ...base, text: '', startPct: null, items: [{ answer: '', pct: null }, { answer: '', pct: null }] };
    case 'content_heading_text': return { id, type, heading: '', text: '', center: false, host_notes: '' };
    case 'content_heading_image_text': return { id, type, heading: '', text: '', imageUrl: null, imageSide: 'left', host_notes: '' };
    case 'content_image': return { id, type, imageUrl: null, host_notes: '' };
  }
  return base;
}

function renderQuestionEditor() {
  const ed = document.getElementById('q-editor');
  if (!ed) return;
  const q = editingEp.questions.find(x => x.id === editingQId);
  if (!q) {
    ed.innerHTML = `<div class="q-editor-empty">Pick a slide on the left, or add a new one below.</div>`;
    return;
  }
  const isContent = isContentType(q.type);

  let body = '';
  if (isContent) {
    body = editorContent(q);
  } else {
    switch (q.type) {
      case 'two_choice': body = editorTwoChoice(q); break;
      case 'multiple_choice': body = editorMultipleChoice(q); break;
      case 'over_under': body = editorOverUnder(q); break;
      case 'guess_pct': body = editorGuessPct(q); break;
      case 'name_as_many': body = editorNameAsMany(q); break;
      case 'guess_breakdown': body = editorGuessBreakdown(q); break;
      case 'ranking': body = editorRanking(q); break;
      case 'guess_data': body = editorGuessData(q); break;
      case 'tiebreaker': body = editorTiebreaker(q); break;
      case 'higher_lower': body = editorHigherLower(q); break;
    }
  }

  const typeLabel = isContent
    ? q.type.replace(/^content_/, '').replace(/_/g, ' ')
    : q.type.replace(/_/g, ' ');

  // Question slides get the "Format label" + "Question text" + "Host notes" common fields.
  // Content slides skip those and provide their own fields inside `body`.
  const commonFields = isContent ? '' : `
    <div class="field">
      <label>Question text</label>
      <textarea id="qe-text" rows="2" placeholder="The main prompt shown on the slide…" maxlength="160">${escHtml(q.text || '')}</textarea>
    </div>
    <div class="field" style="margin-top:14px;">
      <label>Source <span style="color:var(--text-muted); font-weight:400; text-transform:none; letter-spacing:0;">— shown at bottom of slide</span></label>
      <input id="qe-source" value="${escHtml(q.source || '')}" placeholder="e.g. YouGov, 2024 · n=2,847" maxlength="120">
    </div>
    <div class="field" style="margin-top:10px;">
      <label>Source logo <span style="color:var(--text-muted); font-weight:400; text-transform:none; letter-spacing:0;">— defaults to YouGov</span></label>
      <div style="display:flex; align-items:center; gap:10px; margin-top:4px;">
        <img id="qe-source-logo-preview" src="${escHtml(q.sourceImageUrl !== undefined ? q.sourceImageUrl : 'DEFAULT')}"
          style="height:22px; object-fit:contain; border:1px solid var(--border); padding:2px 6px; background:#fff; display:${q.sourceImageUrl !== undefined ? 'block' : 'none'}">
        <span id="qe-source-logo-default" style="font-family:var(--mono); font-size:11px; color:var(--text-muted); display:${q.sourceImageUrl === undefined ? 'inline' : 'none'}">Using default (YouGov)</span>
        <button class="btn btn-sm" id="qe-source-logo-upload">Upload logo</button>
        ${q.sourceImageUrl !== undefined ? `<button class="btn btn-sm btn-danger" id="qe-source-logo-remove">Remove</button>` : ''}
      </div>
      <input type="file" id="qe-source-logo-file" accept="image/png,image/jpeg,image/webp,image/svg+xml" style="display:none">
    </div>
    <div class="field" style="margin-top:14px;">
      <label>Host notes <span style="color:var(--text-muted); font-weight:400; letter-spacing:0.05em; text-transform:none;">— shown only on the presenter screen</span></label>
      <textarea id="qe-host-notes" rows="3" placeholder="Things to say, set-up, trivia for after the reveal…">${escHtml(q.host_notes || '')}</textarea>
      <div class="field-hint">Use &lt;em&gt;…&lt;/em&gt;, &lt;strong&gt;…&lt;/strong&gt;, or &lt;br&gt; for emphasis. Never appears on the audience screen.</div>
    </div>
    <div class="section-h">Type-specific fields</div>`;

  ed.innerHTML = `
    <div class="q-editor-bar">
      <div class="q-type-pill">${typeLabel}</div>
      <div style="display:flex; gap:8px;">
        <button class="btn btn-sm" data-act="up">↑</button>
        <button class="btn btn-sm" data-act="down">↓</button>
        <button class="btn btn-sm btn-danger" data-act="delete">Delete</button>
      </div>
    </div>
    ${commonFields}
    ${body}`;

  if (!isContent) {
    document.getElementById('qe-text').addEventListener('input', e => { q.text = e.target.value; renderQuestionList(); });
    document.getElementById('qe-host-notes').addEventListener('input', e => { q.host_notes = e.target.value; });

    // Source text
    const srcInput = document.getElementById('qe-source');
    if (srcInput) srcInput.addEventListener('input', e => { q.source = e.target.value; });

    // Source logo upload
    const logoFile = document.getElementById('qe-source-logo-file');
    const logoUpload = document.getElementById('qe-source-logo-upload');
    const logoRemove = document.getElementById('qe-source-logo-remove');
    if (logoUpload && logoFile) {
      logoUpload.addEventListener('click', e => { e.preventDefault(); logoFile.click(); });
      logoFile.addEventListener('change', e => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => {
          q.sourceImageUrl = ev.target.result;
          renderQuestionEditor();
        };
        reader.readAsDataURL(file);
        logoFile.value = '';
      });
    }
    if (logoRemove) {
      logoRemove.addEventListener('click', e => {
        e.preventDefault();
        // undefined means "use default"; null means "no logo"
        q.sourceImageUrl = undefined;
        renderQuestionEditor();
      });
    }
  }
  ed.querySelectorAll('[data-act]').forEach(b => {
    b.onclick = () => {
      const idx = editingEp.questions.findIndex(x => x.id === q.id);
      if (b.dataset.act === 'up' && idx > 0) {
        [editingEp.questions[idx - 1], editingEp.questions[idx]] = [editingEp.questions[idx], editingEp.questions[idx - 1]];
      } else if (b.dataset.act === 'down' && idx < editingEp.questions.length - 1) {
        [editingEp.questions[idx + 1], editingEp.questions[idx]] = [editingEp.questions[idx], editingEp.questions[idx + 1]];
      } else if (b.dataset.act === 'delete') {
        if (!confirm('Delete this slide?')) return;
        editingEp.questions.splice(idx, 1);
        editingQId = editingEp.questions[Math.min(idx, editingEp.questions.length - 1)]?.id || null;
      }
      renderQuestionList();
      renderQuestionEditor();
    };
  });

  attachTypeListeners(q);
}

function attachContentEditorListeners(q) {
  const heading = document.querySelector('[data-cf-heading]');
  if (heading) heading.addEventListener('input', e => { q.heading = e.target.value; renderQuestionList(); });
  const text = document.querySelector('[data-cf-text]');
  if (text) text.addEventListener('input', e => { q.text = e.target.value; renderQuestionList(); });
  const center = document.querySelector('[data-cf-center]');
  if (center) center.addEventListener('change', e => { q.center = e.target.checked; });
  const imgSide = document.querySelector('[data-cf-imageside]');
  if (imgSide) imgSide.addEventListener('change', e => { q.imageSide = e.target.value; });
  const host = document.querySelector('[data-cf-host]');
  if (host) host.addEventListener('input', e => { q.host_notes = e.target.value; });

  // Image upload (if applicable)
  const imgInput = document.getElementById('cf-image-input');
  const upBtn = document.querySelector('[data-cf-img-upload]');
  const rmBtn = document.querySelector('[data-cf-img-remove]');
  if (upBtn && imgInput) {
    upBtn.onclick = e => { e.preventDefault(); imgInput.click(); };
    imgInput.addEventListener('change', e => {
      const file = e.target.files[0];
      if (!file) return;
      const HARD_MAX = 20 * 1024 * 1024; // 20 MB
      if (file.size > HARD_MAX) {
        alert(`That image is ${(file.size / 1024 / 1024).toFixed(1)} MB — please pick one under 20 MB.`);
        imgInput.value = '';
        return;
      }
      // Content slide images are downscaled to 1280 max-dimension JPEG
      // (preserves aspect ratio rather than cropping square like contestant photos)
      downscaleImageContain(file, 1280, 0.85)
        .then(dataUrl => {
          q.imageUrl = dataUrl;
          renderQuestionEditor();
        })
        .catch(err => alert('Could not process that image: ' + (err.message || err)));
      imgInput.value = '';
    });
  }
  if (rmBtn) {
    rmBtn.onclick = e => {
      e.preventDefault();
      if (!confirm('Remove this image?')) return;
      q.imageUrl = null;
      renderQuestionEditor();
    };
  }
}

// ─── PROMO IMAGE GENERATOR ───
// Builds three promo images for an episode in the show's RAW style and downloads them.
// Renders offscreen, captures with html2canvas, and triggers a save per-size.
function buildPromoHTML(ep, size) {
  const f = ep.framing || {};
  const contestants = (ep.contestants || []).filter(c => c.name && c.name.trim());
  // Wordmark — same splat treatment as the title slide
  const t = (f.title || 'NON-CENSUS').trim();
  const splatize = s => escHtml(s).replace(/-/g, '<span class="splat">—</span>');
  const dashIdx = t.indexOf('-');
  let wm;
  if (dashIdx > 0 && dashIdx < t.length - 1) {
    wm = splatize(t.slice(0, dashIdx + 1)) + '<br>' + splatize(t.slice(dashIdx + 1));
  } else {
    wm = splatize(t);
  }
  // Contestant blocks
  const photoSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="3.5"/><path d="M5 21c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>`;
  const contestantHtml = contestants.length === 0
    ? ''
    : contestants.map((c, i) => {
        const photo = c.photoUrl
          ? `<img class="promo-contestant-photo" src="${escHtml(c.photoUrl)}" alt="">`
          : `<div class="promo-contestant-photo promo-contestant-photo-empty">${photoSvg}</div>`;
        return `<div class="promo-contestant">
          <div class="promo-contestant-photo-wrap">${photo}</div>
          <div class="promo-contestant-name">${escHtml(c.name)}</div>
        </div>`;
      }).join(contestants.length === 2 ? `<div class="promo-vs">vs.</div>` : '');
  // Title for the episode
  const epTitle = ep.name && ep.name.trim() && ep.name !== 'Untitled Episode'
    ? `<div class="promo-episode-title">${safeRich(ep.name)}</div>`
    : '';
  // Decoration: sparks, tape, and bottom torn band
  const chrome = `
    <span class="promo-spark tl">✸</span>
    <span class="promo-spark br">✸</span>
    <span class="promo-tape tr"></span>
    <span class="promo-tape bl"></span>`;
  return `<div class="promo ${size}">
    ${chrome}
    <div class="promo-wordmark">${wm}</div>
    ${epTitle}
    ${contestantHtml ? `<div class="promo-contestants">${contestantHtml}</div>` : ''}
  </div>`;
}

function downloadDataURL(dataUrl, filename) {
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function slugifyForFilename(s) {
  return String(s || 'episode').trim().toLowerCase()
    .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60) || 'episode';
}

async function generatePromoPack(ep, statusFn) {
  const sizes = [
    { key: 'square', label: 'square (1080×1080)', w: 1080, h: 1080 },
    { key: 'story',  label: 'story (1080×1920)',  w: 1080, h: 1920 },
    { key: 'wide',   label: 'wide (1920×1080)',   w: 1920, h: 1080 },
  ];
  const slug = slugifyForFilename(ep.name);

  // Render each size, capture, download. Done sequentially so the offscreen container
  // stays predictable and we don't blow memory on three giant canvases at once.
  for (let i = 0; i < sizes.length; i++) {
    const s = sizes[i];
    if (statusFn) statusFn(`Rendering ${s.label} (${i + 1}/${sizes.length})…`);
    // Build offscreen host
    const host = document.createElement('div');
    host.style.cssText = 'position:fixed; left:-99999px; top:0; pointer-events:none; z-index:-1;';
    host.innerHTML = buildPromoHTML(ep, s.key);
    document.body.appendChild(host);
    try {
      // Wait one frame so any images inside (contestant photos) start loading
      await new Promise(r => requestAnimationFrame(r));
      // Wait for any <img> children to fully load before snapshotting
      const imgs = Array.from(host.querySelectorAll('img'));
      await Promise.all(imgs.map(img => img.complete ? Promise.resolve() : new Promise(r => {
        img.addEventListener('load', r); img.addEventListener('error', r);
      })));
      // Wait for fonts
      if (document.fonts && document.fonts.ready) await document.fonts.ready;
      // Capture
      const canvas = await html2canvas(host.firstElementChild, {
        backgroundColor: null,
        width: s.w, height: s.h,
        scale: 1,
        useCORS: true,
        logging: false,
      });
      const dataUrl = canvas.toDataURL('image/png');
      downloadDataURL(dataUrl, `non-census-${slug}-${s.key}.png`);
      // Tiny pause between downloads so the browser doesn't bunch them up
      await new Promise(r => setTimeout(r, 250));
    } finally {
      document.body.removeChild(host);
    }
  }
}

// Downscale image preserving aspect ratio (max-dimension version, for content-slide images).
function downscaleImageContain(file, maxDim = 1280, quality = 0.85) {
  return new Promise((resolve, reject) => {
    if (!file.type || !file.type.startsWith('image/')) {
      return reject(new Error('Not an image file.'));
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read file.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not decode image.'));
      img.onload = () => {
        try {
          let w = img.naturalWidth, h = img.naturalHeight;
          const scale = Math.min(1, maxDim / Math.max(w, h));
          w = Math.round(w * scale); h = Math.round(h * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        } catch (err) { reject(err); }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

      });
    });
    document.querySelectorAll('[data-mc-del]').forEach(btn => {

.scm-check-row {
  display: flex; align-items: center; gap: 8px; margin-bottom: 16px;
  font-size: 14px; color: var(--text-off); cursor: pointer;
}
.scm-check-row input { width: 15px; height: 15px; cursor: pointer; accent-color: var(--accent); }
#social-cards-status {
  min-height: 20px; font-size: 13px;
  color: var(--text-muted); margin-bottom: 16px;
  font-family: var(--mono);
}
.scm-actions {
  display: flex; gap: 10px; justify-content: flex-end;
}
.scm-btn {
  font-family: var(--mono); font-size: 12px; font-weight: 700;
  letter-spacing: 0.15em; text-transform: uppercase;
  padding: 9px 18px; border: 1px solid var(--border-strong);
  background: var(--bg); color: var(--text); cursor: pointer;
  transition: background .12s;
}
.scm-btn:hover { background: var(--surface-hover); }
.scm-btn.primary {
  background: var(--accent); color: #fff;
  border-color: var(--accent);
}
.scm-btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.scm-btn:disabled { opacity: 0.45; cursor: not-allowed; }
</style>

<div id="social-cards-overlay">
  <div id="social-cards-modal">
    <div class="scm-title">Export Social Cards</div>
    <div class="scm-epname" id="scm-epname">Episode Name</div>

    <div class="scm-fmt-row">
      <button class="social-fmt-btn selected" data-fmt="youtube">
        <div class="sfb-name">YouTube</div>
        <div class="sfb-size">1280 × 720</div>
      </button>
      <button class="social-fmt-btn" data-fmt="instagram">
        <div class="sfb-name">Instagram</div>
        <div class="sfb-size">1080 × 1080</div>
      </button>
      <button class="social-fmt-btn" data-fmt="tiktok">
        <div class="sfb-name">TikTok</div>
        <div class="sfb-size">1080 × 1920</div>
      </button>
    </div>

    <label class="scm-check-row">
      <input type="checkbox" id="social-include-revealed" checked>
      Include revealed state (show answers)
    </label>

    <div id="social-cards-status"></div>

    <div class="scm-actions">
      <button class="scm-btn" id="social-cards-cancel">Cancel</button>
      <button class="scm-btn primary" id="social-cards-go">Export Questions</button>
    </div>
  </div>
</div>

<script>
(function() {
  let _socialEpId = null;
  let _socialFmt  = 'youtube';
  let _socialBusy = false;

  const overlay   = document.getElementById('social-cards-overlay');
  const epNameEl  = document.getElementById('scm-epname');
  const status    = document.getElementById('social-cards-status');
  const goBtn     = document.getElementById('social-cards-go');
  const cancelBtn = document.getElementById('social-cards-cancel');
  const fmtBtns   = document.querySelectorAll('.social-fmt-btn');

  function setFmt(fmt) {
    _socialFmt = fmt;
    fmtBtns.forEach(b => b.classList.toggle('selected', b.dataset.fmt === fmt));
  }

  fmtBtns.forEach(b => b.addEventListener('click', () => setFmt(b.dataset.fmt)));

  cancelBtn.addEventListener('click', () => {
    if (_socialBusy) return;
    overlay.classList.remove('open');
  });

  overlay.addEventListener('click', e => {
    if (e.target === overlay && !_socialBusy) overlay.classList.remove('open');
  });

  goBtn.addEventListener('click', async () => {
    if (_socialBusy) return;
    const ep = getEpisode(_socialEpId);
    if (!ep) return;
    _socialBusy = true;
    goBtn.disabled = true;
    cancelBtn.disabled = true;
    const includeRevealed = document.getElementById('social-include-revealed').checked;
    try {
      await exportSocialCards(ep, _socialFmt, includeRevealed, msg => { status.textContent = msg; });
      status.textContent = '✓ Done — files downloaded.';
    } catch(err) {
      console.error('Social export failed:', err);
      status.textContent = 'Export failed: ' + (err.message || err);
    } finally {
      _socialBusy = false;
      goBtn.disabled = false;
      cancelBtn.disabled = false;
    }
  });

  window.showSocialCardsModal = function(epId) {
    const ep = getEpisode(epId);
    if (!ep) return;
    _socialEpId = epId;
    _socialBusy = false;
    status.textContent = '';
    goBtn.disabled = false;
    cancelBtn.disabled = false;
    setFmt('youtube');
    const qCount = (ep.questions || []).filter(q => q && q.type !== 'break').length;
    epNameEl.textContent = ep.name || 'Untitled Episode';
    goBtn.textContent = `Export ${qCount} Question${qCount !== 1 ? 's' : ''}`;
    overlay.classList.add('open');
  };
})();

async function exportSocialCards(ep, format, includeRevealed, statusFn) {
  const sizes = {
    youtube:   { w: 1280, h: 720  },
    instagram: { w: 1080, h: 1080 },
    tiktok:    { w: 1080, h: 1920 },
  };
  const s = sizes[format] || sizes.youtube;
  const slug = slugifyForFilename(ep.name);
  const questions = (ep.questions || []).filter(q => q && q.type !== 'break');

  if (!questions.length) {
    if (statusFn) statusFn('No question slides found.');
    return;
  }

  for (let i = 0; i < questions.length; i++) {
    const q = questions[i];
    if (statusFn) statusFn(`Rendering Q${i + 1} of ${questions.length}…`);

    // Build slide HTML (same pipeline used by the live game)
    const slideHtml = buildQuestionSlide(ep, q);

    // Offscreen host at native 1280×720
    const host = document.createElement('div');
    host.style.cssText = [
      'position:fixed',
      'left:-99999px',
      'top:0',
      'width:1280px',
      'height:720px',
      'overflow:hidden',
      'pointer-events:none',
      'z-index:-1',
    ].join(';');
    host.innerHTML = slideHtml;

    // Activate the slide so revealed CSS applies if requested
    const slideEl = host.firstElementChild;
    if (slideEl) {
      slideEl.classList.add('active');
      if (includeRevealed) slideEl.classList.add('revealed');
      slideEl.style.cssText = 'position:absolute;inset:0;';
      // Ensure the .slide-frame fills 1280×720 at scale 1
      const frame = slideEl.querySelector('.slide-frame');
      if (frame) { frame.style.transform = 'scale(1)'; }
    }

    document.body.appendChild(host);
    try {
      // Wait for layout + images + fonts
      await new Promise(r => requestAnimationFrame(r));
      const imgs = Array.from(host.querySelectorAll('img'));
      await Promise.all(imgs.map(img => img.complete
        ? Promise.resolve()
        : new Promise(r => { img.addEventListener('load', r); img.addEventListener('error', r); })));
      if (document.fonts && document.fonts.ready) await document.fonts.ready;

      // Capture at 1280×720
      const captured = await html2canvas(host, {
        width: 1280, height: 720,
        scale: 1,
        backgroundColor: '#0a0d0f',
        useCORS: true,
        logging: false,
      });

      // Compose onto the target canvas, slide centred/fitted
      const out = document.createElement('canvas');
      out.width = s.w; out.height = s.h;
      const ctx = out.getContext('2d');

      // Dark background fill
      ctx.fillStyle = '#0a0d0f';
      ctx.fillRect(0, 0, s.w, s.h);

      // Centre-fit the 1280×720 capture
      const scale = Math.min(s.w / 1280, s.h / 720);
      const dw = Math.round(1280 * scale);
      const dh = Math.round(720 * scale);
      const dx = Math.round((s.w - dw) / 2);
      const dy = Math.round((s.h - dh) / 2);
      ctx.drawImage(captured, dx, dy, dw, dh);

      const dataUrl = out.toDataURL('image/jpeg', 0.92);
      downloadDataURL(dataUrl, `non-census-${slug}-q${i + 1}-${format}.jpg`);

      // Brief pause so browser doesn't merge all downloads into one prompt
      await new Promise(r => setTimeout(r, 300));
    } finally {
      document.body.removeChild(host);
    }
  }
}
</script>

</body>
