function escHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function safeRich(s) {
  if (s == null) return '';
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/&lt;(\/?(?:em|strong|br))(?:\s*\/)?&gt;/gi, '<$1>');
}

// Scale an element's font-size down until its single-line content fits its container width.
// Uses binary search between min and max px values. Idempotent — safe to call repeatedly.
// Element must be display: block (or inline-block) and use white-space: nowrap.
function fitTextToWidth(el, opts = {}) {
  if (!el) return;
  const min = opts.min || 16;
  const max = opts.max || 200;
  const tolerance = opts.tolerance || 1.5;
  const parent = el.parentElement;
  if (!parent) return;
  // Reset to max to measure
  el.style.whiteSpace = 'nowrap';
  el.style.fontSize = max + 'px';
  // If it already fits at max, done
  const targetW = parent.clientWidth;
  if (!targetW) return;
  if (el.scrollWidth <= targetW) {
    el.style.fontSize = max + 'px';
    return;
  }
  // Binary search
  let lo = min, hi = max;
  let lastFit = min;
  for (let i = 0; i < 18; i++) {
    const mid = (lo + hi) / 2;
    el.style.fontSize = mid + 'px';
    if (el.scrollWidth <= targetW) {
      lastFit = mid;
      lo = mid;
    } else {
      hi = mid;
    }
    if (hi - lo < tolerance) break;
  }
  el.style.fontSize = lastFit + 'px';
}

// Fit contestant names so no single word overflows the column width.
// Uses a hidden measurement span to find the longest word, then binary-searches
// for the largest font size where that word fits without a mid-character break.
function fitContestantNames() {
  // Reusable measurement span
  const probe = document.createElement('span');
  probe.style.cssText = 'visibility:hidden;white-space:nowrap;position:absolute;top:-9999px;left:-9999px;font-family:var(--display);font-weight:400;text-transform:uppercase;letter-spacing:-0.02em';
  document.body.appendChild(probe);

  document.querySelectorAll('.contestant-name').forEach(el => {
    el.style.fontSize = '';
    const parent = el.parentElement;
    if (!parent) return;
    const colWidth = parent.clientWidth;
    if (!colWidth) return;

    // Find the longest word in the name
    const words = (el.textContent || '').trim().split(/\s+/);
    const longestWord = words.reduce((a, b) => a.length > b.length ? a : b, '');
    if (!longestWord) return;

    probe.textContent = longestWord;

    // Start at CSS default (72px). If it fits, leave it alone.
    probe.style.fontSize = '72px';
    if (probe.scrollWidth <= colWidth) return;

    // Binary search down to the largest size where the longest word fits
    let lo = 24, hi = 72, lastFit = 24;
    for (let i = 0; i < 16; i++) {
      const mid = (lo + hi) / 2;
      probe.style.fontSize = mid + 'px';
      if (probe.scrollWidth <= colWidth) { lastFit = mid; lo = mid; }
      else { hi = mid; }
      if (hi - lo < 1) break;
    }
    el.style.fontSize = lastFit + 'px';
  });

  document.body.removeChild(probe);
}

// Shrink question text on a single slide if its rendered height would crowd out the answers.
// Reads computed line-height to decide what counts as "too tall" — generally allows the
// question to occupy at most ~55% of the slide's content area.
function fitQuestionText(slide) {
  if (!slide) return;
  const el = slide.querySelector('.q-text, .q-text-sm');
  if (!el) return;
  const slideRect = slide.getBoundingClientRect();
  if (!slideRect.height) return;
  // Reserve at least 35% of the slide for options/answer space.
  const maxAllowed = slideRect.height * 0.55;
  // Read the current CSS-computed font size as our starting upper bound.
  const computed = parseFloat(getComputedStyle(el).fontSize) || 32;
  el.style.fontSize = computed + 'px';
  // If it fits, leave alone.
  if (el.scrollHeight <= maxAllowed) return;
  // Binary search downwards to a fitting size.
  let lo = 14, hi = computed;
  let lastFit = lo;
  for (let i = 0; i < 14; i++) {
    const mid = (lo + hi) / 2;
    el.style.fontSize = mid + 'px';
    if (el.scrollHeight <= maxAllowed) {
      lastFit = mid;
      lo = mid;
    } else {
      hi = mid;
    }
    if (hi - lo < 1.5) break;
  }
  el.style.fontSize = lastFit + 'px';
}

function fitAllQuestionText() {
  document.querySelectorAll('.q-slide').forEach(fitQuestionText);
}

// Reset inline font-size on a slide's question text and re-fit. Used after reveal-state
// changes so the CSS's new clamp() applies before the JS measures. Temporarily disables
// the CSS transition so getComputedStyle gives us the target value, not a mid-transition one.
function refitSlideQuestionText(slide) {
  if (!slide) return;
  const el = slide.querySelector('.q-text, .q-text-sm');
  if (!el) return;
  // Save the current transition, suppress it, clear inline font-size, fit, restore transition
  const originalTransition = el.style.transition;
  el.style.transition = 'none';
  el.style.fontSize = '';
  // Defer one frame so the class change + transition suppression apply before measuring
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fitQuestionText(slide);
    // Restore transition on the next frame so subsequent state changes still animate
    requestAnimationFrame(() => { el.style.transition = originalTransition; });
  }));
}

// Downscale an image File to a square data: URL of the given size (default 800px) and JPEG quality.
// Crops center-square, resizes with the canvas, and returns a JPEG data URL. Always returns
// a much smaller payload than the original — typically <100 KB for a headshot.
function downscaleImageToSquareJpeg(file, size = 800, quality = 0.85) {
  return new Promise((resolve, reject) => {
    if (!file.type || !file.type.startsWith('image/')) {
      return reject(new Error('Not an image file.'));
    }
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read file.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not decode image.'));
      img.onload = () => {
        try {
          // Center-crop to a square first
          const srcSize = Math.min(img.naturalWidth, img.naturalHeight);
          const sx = (img.naturalWidth - srcSize) / 2;
          const sy = (img.naturalHeight - srcSize) / 2;
          const canvas = document.createElement('canvas');
          canvas.width = size;
          canvas.height = size;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, sx, sy, srcSize, srcSize, 0, 0, size, size);
          const dataUrl = canvas.toDataURL('image/jpeg', quality);
          resolve(dataUrl);
        } catch (err) {
          reject(err);
        }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderHigherLower(q) {
  const items = q.items || [];
  const startPct = q.startPct != null ? q.startPct : '?';

  const historyHtml = items.map((it, i) => {
    const basePct = i === 0 ? (q.startPct != null ? q.startPct : 0) : (items[i-1].pct != null ? items[i-1].pct : 0);
    const dir = it.pct != null && basePct !== '?' ? (it.pct > basePct ? 'HIGHER' : 'LOWER') : '?';
    return `<div class="q-hl-history-item" data-hl-hist="${i}" style="display:none">
      <span class="q-hl-h-name">${escHtml(it.answer || '')}</span>
      <span class="q-hl-h-dir">${dir}</span>
      <span class="q-hl-h-pct">${it.pct != null ? it.pct + '%' : '?'}</span>
    </div>`;
  }).join('');

  const itemsHtml = items.map((it, i) => {
    const basePct = i === 0 ? (q.startPct != null ? q.startPct : '?') : (items[i-1].pct != null ? items[i-1].pct : '?');
    const correctDir = (it.pct != null && basePct !== '?') ? (it.pct > basePct ? 'higher' : 'lower') : '';
    return `<div class="q-hl-item-card" data-hl-item="${i}" data-hl-correct="${correctDir}" style="display:none">
      <div class="q-hl-item-name">${escHtml(it.answer || '')}</div>
      <div class="q-hl-baseline-pct">${escHtml(String(basePct))}%</div>
      <div class="q-hl-buttons">
        <div class="q-hl-btn" data-hl-dir="higher">▲ HIGHER</div>
        <div class="q-hl-btn" data-hl-dir="lower">▼ LOWER</div>
      </div>
      <div class="q-hl-actual">${it.pct != null ? escHtml(String(it.pct)) + '%' : '?'}</div>
    </div>`;
  }).join('');

  return `<p class="q-text q-text-sm">${safeRich(q.text || '')}</p>
    <div class="q-hl-current">
      ${itemsHtml}
    </div>
    ${renderSourceStrip(q)}`;
}

function applyBreakdownState(slide, count) {
  slide.querySelectorAll('.q-break-row').forEach((row, i) => {
    row.classList.toggle('break-revealed', i < count);
  });
}

// step: -1=all hidden, 0=item0 unresolved, 1=item0 revealed, 2=item1 unresolved, 3=item1 revealed...
function applyHigherLowerState(slide, step) {
  const items = slide.querySelectorAll('.q-hl-item-card');

  if (step < 0) {
    items.forEach(card => { card.style.display = 'none'; card.classList.remove('revealed'); });
    return;
  }

  // step=2i: show item i unresolved; step=2i+1: item i revealed
  const itemIdx = Math.floor(step / 2);
  const isRevealed = step % 2 === 1;

  items.forEach((card, i) => {
    const isCurrent = i === itemIdx;
    card.style.display = isCurrent ? '' : 'none';
    const wasRevealed = card.classList.contains('revealed');
    card.classList.toggle('revealed', isCurrent && isRevealed);
    // Mark correct/incorrect buttons on reveal
    if (isCurrent && isRevealed && !wasRevealed) {
      const correctDir = card.dataset.hlCorrect;
      card.querySelectorAll('.q-hl-btn').forEach(btn => {
        btn.classList.toggle('correct', btn.dataset.hlDir === correctDir);
      });
    }
    if (!isRevealed || !isCurrent) {
      card.querySelectorAll('.q-hl-btn').forEach(btn => btn.classList.remove('correct'));
    }
  });
}

function buildQuestionSlide(ep, q) {
  let body = '';

  switch (q.type) {
    case 'two_choice': body = renderTwoChoice(q); break;
    case 'multiple_choice': body = renderMultipleChoice(q); break;
    case 'over_under': body = renderOverUnder(q); break;
    case 'guess_pct': body = renderGuessPct(q); break;
    case 'name_as_many': body = renderNameAsMany(q); break;
    case 'guess_breakdown': body = renderGuessBreakdown(q); break;
    case 'ranking': body = renderRanking(q); break;
    case 'guess_data': body = renderGuessData(q); break;
    case 'tiebreaker': body = renderTiebreaker(q); break;
    case 'higher_lower': body = renderHigherLower(q); break;
    default: body = `<p class="q-text">[unknown question type: ${escHtml(q.type)}]</p>`;
  }

  // Tag the slide with type-specific classes so per-type CSS (e.g. reveal-time text shrink)
  // can target the right slides.
  const typeClasses = {
    'two_choice': '',
    'multiple_choice': '',
    'over_under': '',
    'guess_pct': ' q-guess-slide',
    'name_as_many': ' q-name-slide',
    'guess_breakdown': ' q-break-slide',
    'ranking': ' q-rank-slide',
    'guess_data': ' q-data-slide',
    'tiebreaker': ' q-tiebreaker-slide',
    'higher_lower': ' q-hl-slide',
  };
  const extraClass = typeClasses[q.type] || '';
  return `<div class="slide q-slide${extraClass}" data-type="question" data-qid="${escHtml(q.id)}">
    <div class="slide-frame">
      <div class="reveal-burst">!</div>
      ${body}
    </div>
  </div>`;
}

// Build a content slide (heading+text, heading+image+text, image-only).
// Content slides have no reveal — one click to advance.
function buildContentSlide(q) {
  const heading = q.heading || '';
  const text = q.text || '';
  const imageUrl = q.imageUrl || null;
  let body = '';
  if (q.type === 'content_heading_text') {
    body = `<div class="content-slide-text${q.center ? ' center' : ''}">
      ${heading ? `<h2 class="content-heading">${safeRich(heading)}</h2>` : ''}
      ${text ? `<div class="content-body">${richBlock(text)}</div>` : ''}
    </div>`;
  } else if (q.type === 'content_heading_image_text') {
    const img = imageUrl
      ? `<img class="content-image" src="${escHtml(imageUrl)}" alt="${escHtml(heading || '')}">`
      : `<div class="content-image" style="aspect-ratio: 4/3; background: var(--surface-2); border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-style: italic;">No image</div>`;
    const imageOnLeft = q.imageSide !== 'right';
    body = `<div class="content-image-layout">
      ${imageOnLeft ? `<div class="content-image-wrap">${img}</div>` : ''}
      <div class="content-slide-text">
        ${heading ? `<h2 class="content-heading">${safeRich(heading)}</h2>` : ''}
        ${text ? `<div class="content-body">${richBlock(text)}</div>` : ''}
      </div>
      ${!imageOnLeft ? `<div class="content-image-wrap">${img}</div>` : ''}
    </div>`;
  } else if (q.type === 'content_image') {
    const img = imageUrl
      ? `<img src="${escHtml(imageUrl)}" alt="">`
      : `<div style="width: 60%; aspect-ratio: 4/3; background: var(--surface-2); border: 1px dashed var(--border); display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-style: italic;">No image</div>`;
    body = `<div class="content-image-only">${img}</div>`;
  }
  return `<div class="slide" data-type="content" data-qid="${escHtml(q.id)}" data-content-type="${escHtml(q.type)}">
    <div class="slide-frame">${body}</div>
  </div>`;
}

// Render rich text as paragraphs — splits on blank lines, supports inline em/strong/br
function richBlock(s) {
  if (s == null) return '';
  const paras = String(s).split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  return paras.map(p => '<p>' + safeRich(p) + '</p>').join('');
}

        <div class="q-mc-text">${safeRich(o.text || '')}</div>
        <div class="q-mc-pct">${o.pct != null ? escHtml(String(o.pct)) + '%' : ''}</div>
      </div>`).join('')}
    </div>
    ${renderSourceStrip(q)}`;
}

function renderOverUnder(q) {
  const baseline = q.number != null ? escHtml(q.number) + '%' : '?%';
  const actual = q.actual != null ? escHtml(q.actual) + '%' : '';
  return `<p class="q-text q-text-sm">${safeRich(q.text || '')}</p>
    <div class="q-ou-options">
      <div class="q-ou-btn${q.correct === 'over' ? ' winner-ou' : ''}">Over</div>
      <div class="q-ou-btn${q.correct === 'under' ? ' winner-ou' : ''}">Under</div>
    </div>
    <div class="q-ou-number-wrap">
      <span class="q-ou-number">${baseline}</span>
      ${actual ? `<span class="q-ou-actual">${actual}</span>` : ''}
    </div>
    ${renderSourceStrip(q)}`;
}

function renderGuessPct(q) {
  return `<p class="q-text q-text-sm">${safeRich(q.text || '')}</p>
    <div class="q-guess-answer">${escHtml(q.answer != null ? q.answer + '%' : '?')}</div>
    ${q.note ? `<p class="q-guess-note">${safeRich(q.note)}</p>` : ''}
    ${renderSourceStrip(q)}`;
}

// Render the source attribution strip shown at the bottom of question slides
function renderSourceStrip(q) {
  const text = (q.source || '').trim();
  const logo = q.sourceImageUrl !== undefined ? q.sourceImageUrl : DEFAULT_SOURCE_LOGO;
  if (!text && !logo) return '';
  return `<div class="q-source-strip">
    ${text ? `<span class="q-source-text">${escHtml(text)}</span>` : ''}
    ${logo ? `<img class="q-source-logo" src="${escHtml(logo)}" alt="source">` : ''}
  </div>`;
}

function buildBarChart(chartData) {
  if (!chartData || !chartData.length) return '';
  const W = 1000, H = 320;
  const padL = 12, padR = 12, padT = 40, padB = 52;
  const chartW = W - padL - padR;
  const chartH = H - padT - padB;
  const n = chartData.length;
  const maxVal = Math.max(...chartData.map(d => Number(d.value) || 0), 1);
  const slotW = chartW / n;
  const barW = slotW * 0.6;
  const barGap = slotW * 0.2;

  let bars = '';
  chartData.forEach((d, i) => {
    const val = Number(d.value) || 0;
    const barH = Math.max(2, (val / maxVal) * chartH);
    const x = padL + i * slotW + barGap;
    const y = padT + chartH - barH;
    // Bar
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${barH.toFixed(1)}" fill="#f5e94a" stroke="#1a1814" stroke-width="2.5"/>`;
    // Value label above bar
    bars += `<text x="${(x + barW/2).toFixed(1)}" y="${(y - 8).toFixed(1)}" text-anchor="middle" font-family="'Bungee', sans-serif" font-size="18" fill="#1a1814" font-weight="400">${escHtml(String(val))}%</text>`;
    // X-axis label
    const label = escHtml(String(d.label));
    bars += `<text x="${(x + barW/2).toFixed(1)}" y="${(padT + chartH + 28).toFixed(1)}" text-anchor="middle" font-family="'Bungee', sans-serif" font-size="18" fill="#1a1814">${label}</text>`;
  });

  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
    <line x1="${padL}" y1="${padT + chartH}" x2="${W - padR}" y2="${padT + chartH}" stroke="#1a1814" stroke-width="3"/>
    ${bars}
  </svg>`;
}

function renderTiebreaker(q) {
  const answer = q.answer != null ? escHtml(String(q.answer)) + (q.unit ? escHtml(q.unit) : '') : '?';
  return `<div class="q-tiebreaker-label">✦ Tiebreaker ✦</div>
    <p class="q-text">${safeRich(q.text || '')}</p>
    <div class="q-tiebreaker-answer">${answer}</div>
    ${renderSourceStrip(q)}`;
}

function renderGuessData(q) {
  // Question text: replace ___ with a blank underline (answer word shown separately on reveal)
  const rawText = q.text || '';
  const blankSpan = `<span class="q-data-blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>`;
  const questionHtml = safeRich(rawText).replace(/___/g, blankSpan);

  const answer = q.answer || '';
  const chartData = q.chartData || [];

  const chartContent = chartData.length > 0
    ? `<div class="q-data-chart">${buildBarChart(chartData)}</div>`
    : `<div class="q-data-placeholder">Add chart data in the editor</div>`;

  return `<p class="q-data-question">${questionHtml}</p>
    <p class="q-data-answer-reveal">${escHtml(answer)}</p>
    ${chartContent}
    ${renderSourceStrip(q)}`;
}

function renderNameAsMany(q) {
  const showList = q.revealList !== false;
  const list = showList && Array.isArray(q.answers) && q.answers.length
    ? `<div class="q-name-list">${q.answers.map(a => {
        if (typeof a === 'string') return `<div class="q-name-item">${escHtml(a)}</div>`;
        return `<div class="q-name-item">${escHtml(a.text || '')}${a.pct != null ? `<span class="pct">${escHtml(a.pct)}%</span>` : ''}</div>`;
      }).join('')}</div>`
    : '';
  const stat = q.statLine ? `<p class="q-name-stat">${safeRich(q.statLine)}</p>` : '';
  return `<p class="q-text q-text-sm">${safeRich(q.text || '')}</p>
    ${q.prompt ? `<p class="q-name-prompt">${safeRich(q.prompt)}</p>` : ''}
    ${list}
    ${stat}
    ${renderSourceStrip(q)}`;
}

function renderGuessBreakdown(q) {
  const opts = q.options || [];
  return `<p class="q-text q-text-sm">${safeRich(q.text || '')}</p>
    <div class="q-break-rows">
      ${opts.map((o, i) => `<div class="q-break-row" data-break-idx="${i}">
        <div class="q-break-label">${safeRich(o.label || '')}</div>
        <div class="q-break-pct">${o.pct != null ? escHtml(o.pct) + '%' : ''}</div>
      </div>`).join('')}
    </div>
    ${renderSourceStrip(q)}`;
}

function renderRanking(q) {
  const items = q.items || [];
  const N = items.length;
  const hasStats = items.some(it => it.stat && String(it.stat).trim());
  const isMany = N > 6;
  const scatter = scatterPositions(q.id || 'r', N, { slotXc: 55, slotW: 50, jitter: isMany ? 0.25 : 0.5 });

  const tiles = items.map((it, i) => {
    const rank = i + 1;
    const sc = scatter[i];
    const statRaw = it.stat ? String(it.stat).trim() : '';
    const statDisplay = statRaw && !isNaN(Number(statRaw)) ? statRaw + '%' : statRaw;
    return `<div class="q-rank-tile"
      data-rank="${rank}"
      data-name="${escHtml(it.name || '')}"
      data-stat="${escHtml(statDisplay)}"
      style="--rx:${sc.x.toFixed(1)}%;--ry:${sc.y.toFixed(1)}%;--rrot:${sc.rot.toFixed(1)}deg">
      <span class="q-rank-tile-name">${escHtml(it.name || '')}</span>
    </div>`;
  }).join('');

  const listCols = isMany ? '2' : '1';
  return `<p class="q-text q-text-sm">${safeRich(q.text || '')}</p>
  <div class="q-rank-list" data-cols="${listCols}" data-has-stats="${hasStats}" data-many="${isMany}"></div>
  <div class="q-rank-stage" data-rank-total="${N}" data-has-stats="${hasStats}" data-many="${isMany}">
    ${tiles}
  </div>
  ${renderSourceStrip(q)}`;
}

// Deterministic per-item scatter coordinates. Returns array of {x, y, rot} in % units.
// Avoids the slot column on the left so initial layout doesn't sit on top of the future list.
function scatterPositions(seed, n, opts = {}) {
  // Use the same hash/PRNG as shuffledOrder
  let h = 2166136261;
  const seedStr = 'scatter:' + seed;
  for (let i = 0; i < seedStr.length; i++) {
    h ^= seedStr.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  const rand = () => {
    h = (h + 0x6D2B79F5) | 0;
    let t = h;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  // Initial scatter spans the full stage. Items can overlap the slot column —
  // they'll drift away once reveals start.
  const positions = [];
  // Use a poisson-disc-ish jittered grid so items spread out evenly without overlapping too much
  const cols = Math.ceil(Math.sqrt(n * 1.4));
  const rows = Math.ceil(n / cols);
  const cellW = 92 / cols; // leave ~4% margin each side
  const cellH = 92 / rows;
  // shuffle cells so items don't go in row-major order
  const cellOrder = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) cellOrder.push({ r, c });
  for (let i = cellOrder.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [cellOrder[i], cellOrder[j]] = [cellOrder[j], cellOrder[i]];
  }
  for (let i = 0; i < n; i++) {
    const cell = cellOrder[i];
    const cx = 4 + cell.c * cellW + cellW / 2;
    const cy = 4 + cell.r * cellH + cellH / 2;
    const jitter = opts.jitter !== undefined ? opts.jitter : 0.55;
    const jitterX = (rand() - 0.5) * cellW * jitter;
    const jitterY = (rand() - 0.5) * cellH * jitter;
    const rot = (rand() - 0.5) * 8;
    positions.push({ x: cx + jitterX, y: cy + jitterY, rot });
  }
  return positions;
}

// Deterministic Fisher-Yates: PRNG seeded from a string id so two windows agree on order.
function shuffledOrder(seed, n) {
  let h = 2166136261; // FNV-1a-ish hash of the seed
  for (let i = 0; i < seed.length; i++) {
    h ^= seed.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  const rand = () => {
    // Mulberry32
    h = (h + 0x6D2B79F5) | 0;
    let t = h;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  const arr = Array.from({ length: n }, (_, i) => i);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  // Edge case: if shuffle happens to land in correct order on a small list, swap first two
  if (n >= 2 && arr.every((v, i) => v === i)) {
    [arr[0], arr[1]] = [arr[1], arr[0]];
  }
  return arr;
}

function buildCloseSlide() {
  return `<div class="slide" id="close-slide" data-type="static"></div>`;
}

function buildDeck(ep) {
  let html = '';
  html += buildSetupSlide(ep);
  html += buildTitleSlide(ep);
  // Contestant slides (one per defined contestant)
  const contestants = ep.contestants || [];
  contestants.forEach((c, i) => { html += buildContestantSlide(c, i, contestants.length); });
  // Build each item — content slides and question slides interleave in whatever order
  ep.questions.forEach(q => { html += buildItemSlide(ep, q); });
  html += buildCloseSlide();
  deckEl.innerHTML = html;
  slides = Array.from(deckEl.querySelectorAll('.slide'));
  // Scale frames + fit contestant names after layout settles
  requestAnimationFrame(() => requestAnimationFrame(() => {
    scaleFrames();
    fitContestantNames();
  }));
}

// Dispatch builder: picks question vs content slide based on type
const CONTENT_TYPES = ['content_heading_text', 'content_heading_image_text', 'content_image'];
function isContentType(type) { return CONTENT_TYPES.includes(type); }

function buildItemSlide(ep, q) {
  if (isContentType(q.type)) return buildContentSlide(q);
  if (q.type === 'tiebreaker') return ''; // tiebreaker slides are injected on-demand by the presenter
  return buildQuestionSlide(ep, q);
}

// ╔════════════════════════════════════════════════╗
// ║ FLOW                                           ║
// ╚════════════════════════════════════════════════╝

// Build a stable "key" for a slide so revealed-state survives Show-Scores insertions
function slideKey(idx) {
  const s = slides[idx];
  if (!s) return null;
  if (s.dataset.qid) return 'q:' + s.dataset.qid;
  return 'idx:' + idx + ':' + s.dataset.type;
}

// ─── PICKER ───
function showPicker() {
  currentEpisode = null;
  state.phase = 'picker';
  state.episodeId = null;
  state.contestants = [];
  state.scoring = false;
  state.current = 0;
  state.revealed = {};
  state.showScoresInjected = false;
  state.tiebreakerInjected = false;
  state.tiebreakerAfter = -1;

  hintEl.style.display = 'none';
  navEl.style.display = 'none';
  deckEl.innerHTML = buildPickerSlide();
  slides = Array.from(deckEl.querySelectorAll('.slide'));
  slides[0].classList.add('active');
  attachPickerHandlers();

  updatePresenterSurface();
  broadcastState();
}

function attachPickerHandlers() {
  const slide = slides[0];
  slide.querySelectorAll('.episode-card').forEach(card => {
    card.addEventListener('click', e => {
      e.stopPropagation();
      loadEpisodeForPlay(card.dataset.ep);
    });
  });
  slide.querySelector('[data-act="studio"]').addEventListener('click', e => {
    e.stopPropagation(); openStudio();
  });
  slide.querySelector('[data-act="import"]').addEventListener('click', e => {
    e.stopPropagation(); document.getElementById('import-file').click();
  });
  const presBtn = slide.querySelector('[data-act="presenter"]');
  if (presBtn) presBtn.addEventListener('click', e => { e.stopPropagation(); openAudienceWindow(); });
  const cloudBtn = slide.querySelector('[data-act="cloud"]');
  if (cloudBtn) cloudBtn.addEventListener('click', e => { e.stopPropagation(); showCloudModal(); });
}

// ─── SETUP / LAUNCH ───
function loadEpisodeForPlay(id) {
  const ep = migrateEpisode(getEpisode(id));
  if (!ep) { alert('Episode not found.'); return; }
  currentEpisode = ep;
  state.episodeId = id;
  state.phase = 'setup';
  buildDeck(ep);
  state.current = 0;
  slides.forEach(s => s.classList.remove('active'));
  slides[0].classList.add('active');
  attachSetupHandlers();
  navEl.style.display = 'none';
  hintEl.style.display = 'block';
  hintEl.textContent = 'Confirm to start';

  updatePresenterSurface();
  broadcastState();
}

function attachSetupHandlers() {
  const slide = slides[0];
  const startBtn = slide.querySelector('[data-act="start"]');
  if (startBtn) startBtn.addEventListener('click', e => { e.stopPropagation(); startGame(); });
  const skipBtn = slide.querySelector('[data-act="skip"]');
  if (skipBtn) skipBtn.addEventListener('click', e => { e.stopPropagation(); skipSetup(); });
  const editBtn = slide.querySelector('[data-act="edit"]');
  if (editBtn) editBtn.addEventListener('click', e => {
    e.stopPropagation();
    if (currentEpisode && !currentEpisode.isDemo) {
      openStudio();
      // editEpisode requires the saved version — get a fresh copy
      const fresh = getEpisode(currentEpisode.id);
      if (fresh) editEpisode(fresh);
    } else {
      openStudio();
    }
  });
  const backBtn = slide.querySelector('[data-act="back"]');
  if (backBtn) backBtn.addEventListener('click', e => { e.stopPropagation(); showPicker(); });
}

function startGame() {
  // Pull contestants from the loaded episode (defined in Studio)
  const sourced = (currentEpisode && Array.isArray(currentEpisode.contestants))
    ? currentEpisode.contestants.filter(c => c.name && c.name.trim())
    : [];
  state.contestants = sourced.map(c => ({ name: c.name.trim(), score: 0 }));
  state.scoring = state.contestants.length > 0;
  if (!state.scoring) {
    // No contestants defined — fall through as a present-only episode
    skipSetup();
    return;
  }
  launchGame();
}
function skipSetup() {
  state.contestants = [];
  state.scoring = false;
  launchGame();
}
function launchGame() {
  state.phase = 'play';
  state.revealed = {};
  state.showScoresInjected = false;
  state.tiebreakerInjected = false;
  state.tiebreakerAfter = -1;
  buildNav();
  renderCloseSlide();
  goTo(1);
  navEl.style.display = 'flex';
  updatePresenterSurface();
  broadcastState();
}

// ─── NAV ───
function buildNav() {
  navEl.innerHTML = '';
  slides.forEach((_, i) => {
    if (i === 0) return;
    const dot = document.createElement('div');
    dot.className = 'nav-dot' + (i === state.current ? ' active' : '');
    dot.addEventListener('click', e => { e.stopPropagation(); goTo(i); });
    navEl.appendChild(dot);
  });
}

function goTo(idx) {
  if (idx < 1 || idx >= slides.length) return;
  // If we're leaving the synthetic Scores slide, remove it from the deck
  if (state.showScoresInjected) {
    const cur = slides[state.current];
    if (cur && cur.dataset.type === 'scores' && idx !== state.current) {
      removeScoresSlide();
      // After removal, indexes shift — recalc the target idx if it was after the inserted one
      if (idx > state.current) idx--;
    }
  }
  if (slides[state.current]) slides[state.current].classList.remove('active');
  const dots = navEl.querySelectorAll('.nav-dot');
  if (dots[state.current - 1]) dots[state.current - 1].classList.remove('active');
  state.current = idx;
  if (slides[state.current]) slides[state.current].classList.add('active');
  if (dots[state.current - 1]) dots[state.current - 1].classList.add('active');
  if (state.current === slides.length - 1) renderCloseSlide();
  // Reflect cached revealed state (in case we navigated back to a question already shown)
  applyRevealedClasses();
  updateHint();
  updatePresenterSurface();
  broadcastState();
}

function applyRevealedClasses() {
  // Mirror state.revealed → DOM classes
  slides.forEach((s, i) => {
    const k = slideKey(i);
    if (!s.classList.contains('q-slide')) return;
    const wasRevealed = s.classList.contains('revealed');
    const rankList = s.querySelector('.q-rank-stage');
    const hlStage = s.querySelector('.q-hl-current');
    if (rankList) {
      // Ranking: state.revealed[k] is a count (0..N); slide-level 'revealed' only when full
      const count = (k && typeof state.revealed[k] === 'number') ? state.revealed[k] : 0;
      const total = parseInt(rankList.dataset.rankTotal, 10) || 0;
      applyRankingState(s, count);
      s.classList.toggle('revealed', count >= total && total > 0);
    } else if (s.classList.contains('q-break-slide')) {
      const count = (k && typeof state.revealed[k] === 'number') ? state.revealed[k] : 0;
      const total = s.querySelectorAll('.q-break-row').length;
      applyBreakdownState(s, count);
      s.classList.toggle('revealed', count >= total && total > 0);
    } else if (hlStage) {
      const step = (k && typeof state.revealed[k] === 'number') ? state.revealed[k] : -1;
      const hlItems = hlStage.querySelectorAll('.q-hl-item-card');
      const maxStep = hlItems.length * 2 - 1;
      applyHigherLowerState(s, step);
      s.classList.toggle('revealed', step >= maxStep && maxStep >= 0);
    } else {
      s.classList.toggle('revealed', !!(k && state.revealed[k]));
    }
    if (wasRevealed !== s.classList.contains('revealed')) {
      refitSlideQuestionText(s);
    }
  });
}

function handleAdvance() {
  const slide = slides[state.current];
  if (!slide) return;
  if (slide.dataset.type === 'setup' || slide.dataset.type === 'picker') return;
  if (slide.classList.contains('q-slide')) {
    const k = slideKey(state.current);
    // Ranking question: reveal one item at a time
    const rankList = slide.querySelector('.q-rank-stage');
    const hlStage = slide.querySelector('.q-hl-current');
    if (rankList) {
      const total = parseInt(rankList.dataset.rankTotal, 10) || 0;
      const cur = typeof state.revealed[k] === 'number' ? state.revealed[k] : 0;
      if (cur < total) {
        const nextCount = cur + 1;
        // Scale up the scatter tile (it grows large, then fades)
        const tile = rankList.querySelector(`.q-rank-tile[data-rank="${nextCount}"]`);
        if (tile) tile.classList.add('q-rank-tile--exiting');
        // After tile exit animation, add list item and broadcast
        setTimeout(() => {
          if (k) state.revealed[k] = nextCount;
          applyRankingState(slide, nextCount);
          if (nextCount === total) { slide.classList.add('revealed'); refitSlideQuestionText(slide); }
          updateHint();
          updatePresenterSurface();
          broadcastState();
        }, 380);
        return;
      }
      // already fully revealed → fall through to advance
    } else if (slide.classList.contains('q-break-slide')) {
      const rows = slide.querySelectorAll('.q-break-row');
      const total = rows.length;
      const cur = typeof state.revealed[k] === 'number' ? state.revealed[k] : 0;
      if (cur < total) {
        const nextCount = cur + 1;
        if (k) state.revealed[k] = nextCount;
        applyBreakdownState(slide, nextCount);
        if (nextCount >= total) { slide.classList.add('revealed'); refitSlideQuestionText(slide); }
        updateHint();
        updatePresenterSurface();
        broadcastState();
        return;
      }
    } else if (hlStage) {
      const items = hlStage.querySelectorAll('.q-hl-item-card');
      const total = items.length;
      const maxStep = total * 2 - 1; // last step = last item revealed
      const cur = typeof state.revealed[k] === 'number' ? state.revealed[k] : -1;
      if (cur < maxStep) {
        const nextStep = cur + 1;
        if (k) state.revealed[k] = nextStep;
        applyHigherLowerState(slide, nextStep);
        if (nextStep >= maxStep) { slide.classList.add('revealed'); refitSlideQuestionText(slide); }
        updateHint();
        updatePresenterSurface();
        broadcastState();
        return;
      }
      // fully done → fall through to advance
    } else if (!slide.classList.contains('revealed')) {
      // Non-ranking: classic single-click reveal
      if (k) state.revealed[k] = true;
      slide.classList.add('revealed');
      refitSlideQuestionText(slide);
      updateHint();
      updatePresenterSurface();
      broadcastState();
      return;
    }
  }
  goTo(state.current + 1);
}

function handleRetreat() {
  const slide = slides[state.current];
  if (slide && slide.classList.contains('q-slide')) {
    const k = slideKey(state.current);
    const rankList = slide.querySelector('.q-rank-stage');
    const hlStage2 = slide.querySelector('.q-hl-current');
    if (rankList) {
      const cur = typeof state.revealed[k] === 'number' ? state.revealed[k] : 0;
      if (cur > 0) {
        const nextCount = cur - 1;
        if (nextCount === 0) {
          if (k) delete state.revealed[k];
        } else if (k) {
          state.revealed[k] = nextCount;
        }
        slide.classList.remove('revealed');
        applyRankingState(slide, nextCount);
        refitSlideQuestionText(slide);
        updateHint();
        updatePresenterSurface();
        broadcastState();
        return;
      }
    } else if (slide.classList.contains('q-break-slide')) {
      const cur = typeof state.revealed[k] === 'number' ? state.revealed[k] : 0;
      if (cur > 0) {
        const nextCount = cur - 1;
        if (nextCount === 0) { if (k) delete state.revealed[k]; } else if (k) state.revealed[k] = nextCount;
        slide.classList.remove('revealed');
        applyBreakdownState(slide, nextCount);
        refitSlideQuestionText(slide);
        updateHint();
        updatePresenterSurface();
        broadcastState();
        return;
      }
    } else if (hlStage2) {
      const cur = typeof state.revealed[k] === 'number' ? state.revealed[k] : -1;
      if (cur >= 0) {
        const nextStep = cur - 1;
        if (nextStep < 0) { if (k) delete state.revealed[k]; } else if (k) state.revealed[k] = nextStep;
        slide.classList.remove('revealed');
        applyHigherLowerState(slide, nextStep < 0 ? -1 : nextStep);
        refitSlideQuestionText(slide);
        updateHint();
        updatePresenterSurface();
        broadcastState();
        return;
      }
    } else if (slide.classList.contains('revealed')) {
      if (k) delete state.revealed[k];
      slide.classList.remove('revealed');
      refitSlideQuestionText(slide);
      updateHint();
      updatePresenterSurface();
      broadcastState();
      return;
    }
  }
  goTo(state.current - 1);
}

// Apply a "show N items in correct ranked order" state to a ranking slide.
// The list is a normal flow grid — no absolute positioning, no overlap possible.
function applyRankingState(slide, count) {
  const stage = slide.querySelector('.q-rank-stage');
  const list = slide.querySelector('.q-rank-list');
  if (!stage || !list) return;
  const hasStats = stage.dataset.hasStats === 'true';

  // Fade out revealed scatter tiles
  stage.querySelectorAll('.q-rank-tile').forEach(tile => {
    tile.classList.toggle('q-rank-tile--gone', parseInt(tile.dataset.rank, 10) <= count);
  });

  // Rebuild the flow list from scratch
  const tiles = Array.from(stage.querySelectorAll('.q-rank-tile'))
    .sort((a, b) => parseInt(a.dataset.rank) - parseInt(b.dataset.rank))
    .filter(t => parseInt(t.dataset.rank) <= count);

  list.innerHTML = tiles.map(t => {
    const rank = parseInt(t.dataset.rank);
    const name = t.dataset.name || '';
    const stat = t.dataset.stat || '';
    const isNew = rank === count;
    return `<div class="q-rank-list-item${isNew ? ' q-rank-list-item--new' : ''}">
      <div class="q-rank-num">${rank}</div>
      <div class="q-rank-name">${escHtml(name)}</div>
      ${hasStats && stat ? `<div class="q-rank-stat">${escHtml(stat)}</div>` : ''}
    </div>`;
  }).join('');
}

function updateHint() {
  if (!slides[state.current]) return;
  if (state.current === 0) {
    if (slides[0].dataset.type === 'picker') hintEl.textContent = 'Pick an episode';
    else hintEl.textContent = 'Enter names and start';
    return;
  }
  const slide = slides[state.current];
  const isQ = slide.classList.contains('q-slide');
  const isRevealed = slide.classList.contains('revealed');
  const rankList = slide.querySelector('.q-rank-stage');
  if (rankList) {
    const total = parseInt(rankList.dataset.rankTotal, 10) || 0;
    const k = slideKey(state.current);
    const revealedCount = (k && typeof state.revealed[k] === 'number') ? state.revealed[k] : 0;
    if (revealedCount < total) hintEl.textContent = `Click or Space — reveal #${revealedCount + 1} of ${total}`;
    else if (state.current === slides.length - 1) hintEl.textContent = '← Navigate back';
    else hintEl.textContent = 'Space / Click to advance';
  } else if (isQ && !isRevealed) hintEl.textContent = 'Click or Space to reveal';
  else if (state.current === slides.length - 1) hintEl.textContent = '← Navigate back';
  else hintEl.textContent = 'Space / Click to advance';
}

// ─── SCORES SLIDE (synthetic, on-demand) ───
function buildScoresSlideHTML() {
  const sorted = [...state.contestants].sort((a, b) => b.score - a.score);
  const rows = sorted.map((c, i) => `
    <div class="lb-row">
      <div class="lb-rank">${i + 1}</div>
      <div class="lb-name">${escHtml(c.name)}</div>
      <div class="lb-score">${c.score}</div>
    </div>`).join('');
  return `<div class="slide" data-type="scores">
    <div class="slide-frame">
      <div class="close-inner">
        <p class="close-title"><em>Scores.</em></p>
        <div class="leaderboard">${rows}</div>
      </div>
    </div>
  </div>`;
}

function showScores() {
  if (state.phase !== 'play' || !state.scoring || !state.contestants.length) return;
  // If already on the scores slide, do nothing
  if (slides[state.current] && slides[state.current].dataset.type === 'scores') return;
  // If a scores slide is already injected elsewhere, remove it first
  if (state.showScoresInjected) removeScoresSlide();

  const insertAfter = state.current;
  const tmp = document.createElement('div');
  tmp.innerHTML = buildScoresSlideHTML();
  const newSlide = tmp.firstElementChild;
  // Insert in DOM after the current slide
  const cur = slides[insertAfter];
  cur.insertAdjacentElement('afterend', newSlide);
  slides = Array.from(deckEl.querySelectorAll('.slide'));
  state.showScoresInjected = true;
  state.showScoresAfter = insertAfter;
  buildNav();
  scaleFrames();
  goTo(insertAfter + 1);
}

function showTiebreaker() {
  if (state.phase !== 'play' || !currentEpisode) return;
  // If already on a tiebreaker slide, do nothing
  if (slides[state.current] && slides[state.current].dataset.type === 'tiebreaker') return;
  // Remove any existing injected tiebreaker first
  if (state.tiebreakerInjected) removeTiebreakerSlide();
  // Find the next unused tiebreaker question (not yet injected, or pick the first)
  const tbQ = currentEpisode.questions.find(q => q.type === 'tiebreaker');
  if (!tbQ) return;
  // Build the tiebreaker slide HTML
  const slideHtml = buildQuestionSlide(currentEpisode, tbQ);
  const tmp = document.createElement('div');
  tmp.innerHTML = slideHtml;
  const newSlide = tmp.firstElementChild;
  newSlide.dataset.type = 'tiebreaker'; // mark for easy removal
  const cur = slides[state.current];
  cur.insertAdjacentElement('afterend', newSlide);
  slides = Array.from(deckEl.querySelectorAll('.slide'));
  state.tiebreakerInjected = true;
  state.tiebreakerAfter = state.current;
  buildNav();
  scaleFrames();
  goTo(state.current + 1);
}

function removeTiebreakerSlide() {
  const idx = slides.findIndex(s => s.dataset.type === 'tiebreaker');
  if (idx < 0) { state.tiebreakerInjected = false; return; }
  slides[idx].remove();
  slides = Array.from(deckEl.querySelectorAll('.slide'));
  state.tiebreakerInjected = false;
  state.tiebreakerAfter = -1;
  buildNav();
}

function removeScoresSlide() {
  const idx = slides.findIndex(s => s.dataset.type === 'scores');
  if (idx < 0) { state.showScoresInjected = false; return; }
  slides[idx].remove();
  slides = Array.from(deckEl.querySelectorAll('.slide'));
  state.showScoresInjected = false;
  state.showScoresAfter = -1;
  buildNav();
}

// ─── SCORE MUTATIONS ───
function adjustScore(idx, delta) {
  if (!state.contestants[idx]) return;
  state.contestants[idx].score = Math.max(0, state.contestants[idx].score + delta);
  if (state.current === slides.length - 1) renderCloseSlide();
  // If we're on the scores slide, rebuild it in place
  const cur = slides[state.current];
  if (cur && cur.dataset.type === 'scores') {
    const tmp = document.createElement('div');
    tmp.innerHTML = buildScoresSlideHTML();
    const fresh = tmp.firstElementChild;
    cur.replaceWith(fresh);
    fresh.classList.add('active');
    slides = Array.from(deckEl.querySelectorAll('.slide'));
    scaleFrames();
  }
  // Update scoreboard in-place (no rebuild → no animation flash)
  updatePresenterScoreboardInPlace();
  broadcastState();
}

function updatePresenterScoreboardInPlace() {
  if (!psScoreboard) return;
  const maxScore = Math.max(...state.contestants.map(c => c.score));
  state.contestants.forEach((c, i) => {
    const row = psScoreboard.querySelectorAll('.sb-row')[i];
    if (!row) { renderPresenterScoreboard(); return; }
    const pts = row.querySelector('.sb-pts');
    if (pts) pts.textContent = c.score;
    const isLeading = c.score === maxScore && maxScore > 0;
    row.classList.toggle('leading', isLeading);
    const name = row.querySelector('.sb-name');
    if (name) name.classList.toggle('leading', isLeading);
  });
}

// ─── CLOSE / FINAL ───
function renderCloseSlide() {
  const closeSlide = document.getElementById('close-slide');
  if (!closeSlide) return;
  const ep = currentEpisode;
  const closeTitle = ep ? ep.framing.closeTitle : '<em>One honest mirror.</em>';
  const closeBody = ep ? ep.framing.closeBody : '';
  if (state.scoring && state.contestants.length > 0) {
    const sorted = [...state.contestants].sort((a, b) => b.score - a.score);
    const winner = sorted[0];
    const tied = sorted.filter(c => c.score === winner.score && winner.score > 0);
    const titleHtml = winner.score === 0
      ? `<em>No score yet.</em>`
      : tied.length > 1
        ? `It's a <em>tie!</em>`
        : `<em>${escHtml(winner.name)}</em> wins!`;
    const rows = sorted.map((c, i) => `
      <div class="lb-row ${i === 0 && winner.score > 0 ? 'first' : ''}">
        <div class="lb-rank">${i === 0 && winner.score > 0 ? '★' : i + 1}</div>
        <div class="lb-name">${escHtml(c.name)}</div>
        <div class="lb-score">${c.score}</div>
      </div>`).join('');
    closeSlide.innerHTML = `<div class="slide-frame">
      <div class="close-inner">
        <p class="close-title">${titleHtml}</p>
        <div class="leaderboard">${rows}</div>
      </div>
    </div>`;
  } else {
    closeSlide.innerHTML = `<div class="slide-frame">
      <div class="close-inner">
        <p class="close-title">${safeRich(closeTitle)}</p>
        ${closeBody ? `<div class="rule"></div><p class="close-body">${safeRich(closeBody)}</p>` : ''}
      </div>
    </div>`;
  }
  // Scale the newly injected frame to match all other slides
  scaleFrames();
}

// ─── KEY + CLICK ───
document.addEventListener('keydown', e => {
  if (document.getElementById('studio').classList.contains('visible')) return;
  if (e.target.matches('input, textarea, select')) return;
  // Audience window doesn't navigate locally — only via broadcast
  if (role === 'audience') return;
  if (state.current === 0) return;
  if (e.code === 'Space' || e.code === 'ArrowRight') {
    e.preventDefault(); handleAdvance();
  } else if (e.code === 'ArrowLeft') {
    e.preventDefault(); handleRetreat();
  } else if (e.code === 'KeyS' && state.phase === 'play' && state.scoring) {
    e.preventDefault(); showScores();
  }
});

deckEl.addEventListener('click', e => {
  if (document.getElementById('studio').classList.contains('visible')) return;
  if (role === 'audience') return;
  if (state.current === 0) return;
  if (e.target.closest('button, input, textarea, select, .episode-card')) return;
  handleAdvance();
});

// ╔════════════════════════════════════════════════╗
// ║ PRESENTER MODE                                 ║
// ╚════════════════════════════════════════════════╝
let audienceWindow = null;
let bc = null;

// Cross-window sync: use BroadcastChannel where available, fall back to localStorage 'storage' events.
// Both work across same-origin tabs/windows (with some caveats on file:// — the localStorage fallback
// is the more reliable path there).
const SYNC_KEY = 'nonCensus.sync';
const HANDSHAKE_KEY = 'nonCensus.handshake';

function postSyncMessage(msg) {
  // Always write to localStorage too — fires 'storage' event in other windows
  try {
    const wrapped = { ...msg, _ts: Date.now(), _from: role };
    localStorage.setItem(SYNC_KEY, JSON.stringify(wrapped));
  } catch (e) {}
  if (bc) {
    try { bc.postMessage(msg); } catch (e) {}
  }
}

function initBroadcast() {
  if (typeof BroadcastChannel === 'undefined') return null;
  try {
    return new BroadcastChannel('non-census-sync');
  } catch (e) { return null; }
}
bc = initBroadcast();

function broadcastState() {
  // Only the presenter/solo window broadcasts state outward
  if (role === 'audience') return;
  postSyncMessage({
    type: 'state',
    payload: {
      phase: state.phase,
      episodeId: state.episodeId,
      contestants: state.contestants,
      scoring: state.scoring,
      current: state.current,
      revealed: state.revealed,
      showScoresInjected: state.showScoresInjected,
      showScoresAfter: state.showScoresAfter,
      tiebreakerInjected: state.tiebreakerInjected,
      tiebreakerAfter: state.tiebreakerAfter,
    }
  });
}

function openAudienceWindow() {
  if (audienceWindow && !audienceWindow.closed) {
    audienceWindow.focus();
    return;
  }
  // Open a new window pointed at the same URL with #audience hash
  const baseUrl = window.location.href.split('#')[0];
  const url = baseUrl + '#audience';
  audienceWindow = window.open(url, 'non-census-audience', 'width=1280,height=800');
  if (!audienceWindow) {
    alert('Popup blocked. Please allow popups for this site, then click "Open Audience Window" again.');
    return;
  }
  // Optimistically flip into presenter mode after a short delay even if handshake doesn't arrive
  // (some browsers block BroadcastChannel on file:// — the localStorage path will eventually work)
  setTimeout(() => {
    if (audienceWindow && !audienceWindow.closed && role !== 'presenter') {
      role = 'presenter';
      document.body.classList.add('presenter-mode');
      updatePresenterSurface();
      broadcastState();
    }
  }, 800);
}

// Watch for the audience window being closed; revert to solo mode if so
setInterval(() => {
  if (role === 'presenter' && (!audienceWindow || audienceWindow.closed)) {
    role = 'solo';
    audienceWindow = null;
    document.body.classList.remove('presenter-mode');
    updatePresenterSurface();
  }
}, 1000);

// Handle sync messages from BOTH BroadcastChannel and localStorage 'storage' events
function handleSyncMessage(msg) {
  if (!msg || !msg.type) return;
  if (role === 'audience') {
    if (msg.type === 'state') {
      audienceGotState = true;
      applyAudienceState(msg.payload);
      // Stay in waiting state until the presenter actually starts a game (phase = play)
      if (msg.payload && msg.payload.phase === 'play') {
        document.body.classList.remove('audience-waiting');
      } else {
        document.body.classList.add('audience-waiting');
      }
    }
  } else {
    // Presenter/solo side
    if (msg.type === 'hello-audience') {
      role = 'presenter';
      audienceWindow = audienceWindow || (window.opener ? window.opener : null);
      document.body.classList.add('presenter-mode');
      updatePresenterSurface();
      broadcastState();
    } else if (msg.type === 'goodbye-audience') {
      // Don't immediately demote — beforeunload can fire on navigation too. Let the interval check do it.
    }
  }
}

if (bc) {
  bc.addEventListener('message', e => handleSyncMessage(e.data));
}
window.addEventListener('storage', e => {
  if (e.key !== SYNC_KEY || !e.newValue) return;
  try {
    const msg = JSON.parse(e.newValue);
    if (msg._from === role) return; // ignore our own messages
    handleSyncMessage(msg);
  } catch (err) {}
});

// On audience window load, announce ourselves
if (isAudienceWindow) {
  // Show waiting screen until state arrives
  document.body.classList.add('audience-waiting');
  setTimeout(() => {
    postSyncMessage({ type: 'hello-audience' });
  }, 50);
  // Re-announce periodically until we get state, in case presenter wasn't listening yet
  let helloRetries = 0;
  const helloInterval = setInterval(() => {
    if (audienceGotState || helloRetries++ > 20) {
      clearInterval(helloInterval);
      return;
    }
    postSyncMessage({ type: 'hello-audience' });
  }, 500);
  window.addEventListener('beforeunload', () => {
    try { postSyncMessage({ type: 'goodbye-audience' }); } catch (e) {}
  });
}

// Audience: rebuild view from state payload
function applyAudienceState(p) {
  // 1. Make sure the right episode is loaded
  if (p.phase === 'picker') {
    if (!deckEl.querySelector('[data-type="picker"]') || currentEpisode != null) {
      currentEpisode = null;
      deckEl.innerHTML = buildPickerSlide();
      slides = Array.from(deckEl.querySelectorAll('.slide'));
      slides[0].classList.add('active');
    }
    state = { ...state, ...p };
    return;
  }
  if (p.phase === 'setup' || p.phase === 'play') {
    if (!currentEpisode || currentEpisode.id !== p.episodeId) {
      const ep = migrateEpisode(getEpisode(p.episodeId));
      if (!ep) return;
      currentEpisode = ep;
      buildDeck(ep);
    }
  }
  state = { ...state, ...p, contestants: p.contestants || [] };
  currentEpisode = currentEpisode; // unchanged

  // Render close slide content with current scoring
  renderCloseSlide();

  // Handle injected scores slide
  const hasInjected = !!deckEl.querySelector('[data-type="scores"]');
  if (state.showScoresInjected && !hasInjected) {
    // insert into DOM at the right position
    const after = slides[state.showScoresAfter];
    if (after) {
      const tmp = document.createElement('div');
      tmp.innerHTML = buildScoresSlideHTML();
      after.insertAdjacentElement('afterend', tmp.firstElementChild);
      slides = Array.from(deckEl.querySelectorAll('.slide'));
    }
  } else if (!state.showScoresInjected && hasInjected) {
    deckEl.querySelector('[data-type="scores"]').remove();
    slides = Array.from(deckEl.querySelectorAll('.slide'));
  } else if (state.showScoresInjected && hasInjected) {
    // Rebuild contents in case scores changed
    const existing = deckEl.querySelector('[data-type="scores"]');
    const tmp = document.createElement('div');
    tmp.innerHTML = buildScoresSlideHTML();
    existing.replaceWith(tmp.firstElementChild);
    slides = Array.from(deckEl.querySelectorAll('.slide'));
  }

  // Handle injected tiebreaker slide (audience side)
  const hasTb = !!deckEl.querySelector('[data-type="tiebreaker"]');
  if (state.tiebreakerInjected && !hasTb && currentEpisode) {
    const tbQ = currentEpisode.questions.find(q => q.type === 'tiebreaker');
    if (tbQ) {
      const after = slides[state.tiebreakerAfter];
      if (after) {
        const tmp = document.createElement('div');
        tmp.innerHTML = buildQuestionSlide(currentEpisode, tbQ);
        const newSlide = tmp.firstElementChild;
        newSlide.dataset.type = 'tiebreaker';
        after.insertAdjacentElement('afterend', newSlide);
        slides = Array.from(deckEl.querySelectorAll('.slide'));
      }
    }
  } else if (!state.tiebreakerInjected && hasTb) {
    deckEl.querySelector('[data-type="tiebreaker"]').remove();
    slides = Array.from(deckEl.querySelectorAll('.slide'));
  }

  // Apply current slide + revealed state
  slides.forEach((s, i) => s.classList.toggle('active', i === state.current));
  applyRevealedClasses();

}

// ─── PRESENTER UI: render the control surface ───
const presFrame = document.getElementById('presenter-frame');
const psSlotCurrent = document.getElementById('preview-slot-current');
const psSlotNext = document.getElementById('preview-slot-next');
const psScoreboard = document.getElementById('pside-scoreboard');
const psNotes = document.getElementById('pside-notes');
const psMeta = document.getElementById('pside-meta');
const pbarProgress = document.getElementById('pbar-progress');
const pbarPrev = document.getElementById('pbar-prev');
const pbarNext = document.getElementById('pbar-next');
const pbarAdvance = document.getElementById('pbar-advance');
const pbarScores = document.getElementById('pbar-scores');
const pbarTiebreaker = document.getElementById('pbar-tiebreaker');
const pbarEnd = document.getElementById('pbar-end');

// ─── Tab switching ───
let _presenterTab = 'info'; // 'info' | 'audience' | 'next'
const _ptabs    = { info: document.getElementById('ptab-info'), audience: document.getElementById('ptab-audience'), next: document.getElementById('ptab-next') };
const _ppanels  = { info: document.getElementById('ppanel-info'), audience: document.getElementById('ppanel-audience'), next: document.getElementById('ppanel-next') };

function switchPresenterTab(tab, { autoSwitch = false } = {}) {
  _presenterTab = tab;
  Object.entries(_ptabs).forEach(([k, el]) => el && el.classList.toggle('active', k === tab));
  Object.entries(_ppanels).forEach(([k, el]) => el && el.classList.toggle('active', k === tab));
  // When switching to a preview panel, re-fit any already-rendered slides in case the slot just became visible
  if (tab === 'audience' && psSlotCurrent.firstElementChild) {
    fitSlideInSlot(psSlotCurrent, psSlotCurrent.firstElementChild);
  }
  if (tab === 'next' && psSlotNext.firstElementChild) {
    fitSlideInSlot(psSlotNext, psSlotNext.firstElementChild);
  }
}

// Tab click handlers
Object.entries(_ptabs).forEach(([k, el]) => {
  if (el) el.addEventListener('click', e => { e.stopPropagation(); switchPresenterTab(k); });
});

// Keyboard shortcuts: 1=info, 2=audience, 3=next (only when presenter is active)
document.addEventListener('keydown', e => {
  if (role !== 'presenter' || state.phase !== 'play') return;
  if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
  if (e.key === '1') switchPresenterTab('info');
  else if (e.key === '2') switchPresenterTab('audience');
  else if (e.key === '3') switchPresenterTab('next');
});

if (pbarPrev) pbarPrev.addEventListener('click', e => { e.stopPropagation(); handleRetreat(); });
if (pbarNext) pbarNext.addEventListener('click', e => { e.stopPropagation(); goTo(state.current + 1); });
if (pbarAdvance) pbarAdvance.addEventListener('click', e => { e.stopPropagation(); handleAdvance(); });
if (pbarScores) pbarScores.addEventListener('click', e => { e.stopPropagation(); showScores(); });
if (pbarTiebreaker) pbarTiebreaker.addEventListener('click', e => { e.stopPropagation(); showTiebreaker(); });
if (pbarEnd) pbarEnd.addEventListener('click', e => {
  e.stopPropagation();
  if (audienceWindow && !audienceWindow.closed) audienceWindow.close();
  role = 'solo';
  audienceWindow = null;
  document.body.classList.remove('presenter-mode');
  updatePresenterSurface();
});

// Render a slide preview into a slot, scaled to fit.
function renderSlidePreview(slotEl, slideEl, opts = {}) {
  slotEl.innerHTML = '';
  if (!slideEl) {
    slotEl.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; height:100%; color:var(--text-muted); font-style:italic; font-size:13px;">${opts.emptyText || '— end —'}</div>`;
    return;
  }
  // Clone the slide so we don't mess with the live DOM
  const clone = slideEl.cloneNode(true);
  clone.classList.add('active');
  if (opts.revealed) clone.classList.add('revealed');
  else if (opts.unrevealed) {
    clone.classList.remove('revealed');
    // For ranking, also strip per-row reveals so the preview shows the unrevealed state
    // and reset each row to its original scatter coords (in case drift mutated them)
    clone.querySelectorAll('.q-rank-row').forEach(r => {
      r.classList.remove('revealed-row');
      const bx = r.dataset.baseX, by = r.dataset.baseY, br = r.dataset.baseRot;
      if (bx) r.style.setProperty('--rx', bx + '%');
      if (by) r.style.setProperty('--ry', by + '%');
      if (br) r.style.setProperty('--rrot', br + 'deg');
    });
  }
  slotEl.appendChild(clone);
  // Scale to fit the slot
  fitSlideInSlot(slotEl, clone);
}

function fitSlideInSlot(slot, slideEl, _retries) {
  // The .slide is a full-window container; the .slide-frame inside it is 1280×720.
  // For previews, we size the slide to fill the slot and scale the frame to fit.
  const slotRect = slot.getBoundingClientRect();
  if (slotRect.width === 0) {
    // Layout not yet computed (e.g. #presenter-frame just switched from display:none to grid).
    // Retry after the browser completes its layout pass. Cap at 10 retries (~160ms).
    if ((_retries || 0) < 10) requestAnimationFrame(() => fitSlideInSlot(slot, slideEl, (_retries || 0) + 1));
    return;
  }
  const baseW = 1280, baseH = 720;
  slideEl.style.width = slotRect.width + 'px';
  slideEl.style.height = slotRect.height + 'px';
  slideEl.style.transform = '';
  slideEl.style.left = '0';
  slideEl.style.top = '0';
  // Scale the frame inside to fit the slot
  const frame = slideEl.querySelector('.slide-frame');
  if (frame) {
    const scale = Math.min(slotRect.width / baseW, slotRect.height / baseH);
    frame.style.transform = `scale(${scale})`;
  }
}

function updatePresenterSurface() {
  // Manage the `in-play` body class regardless of role — affects which UI is visible
  if (role === 'presenter' && state.phase === 'play') {
    document.body.classList.add('in-play');
  } else {
    document.body.classList.remove('in-play');
  }
  // Only render presenter frame contents when actually in play presenter mode
  if (role !== 'presenter' || state.phase !== 'play') return;

  // Auto-switch to INFO tab whenever the slide index changes
  const _trackSlide = updatePresenterSurface._lastSlide;
  if (_trackSlide !== state.current) {
    updatePresenterSurface._lastSlide = state.current;
    switchPresenterTab('info');
  }

  // Current preview
  const cur = slides[state.current];
  renderSlidePreview(psSlotCurrent, cur);
  // Next preview (un-revealed for question slides)
  const next = slides[state.current + 1];
  renderSlidePreview(psSlotNext, next, { unrevealed: true, emptyText: '— end of episode —' });

  // Progress label
  const totalSlides = slides.length - 1; // excludes setup
  pbarProgress.textContent = state.current === 0
    ? 'setup'
    : `Slide ${state.current} of ${totalSlides}`;

  // Advance button label
  const rankList = cur ? cur.querySelector('.q-rank-stage') : null;
  const hlStage3 = cur ? cur.querySelector('.q-hl-current') : null;
  const isBreakSlide = cur && cur.classList.contains('q-break-slide');
  if (isBreakSlide) {
    const rows = cur.querySelectorAll('.q-break-row');
    const total = rows.length;
    const k = slideKey(state.current);
    const revealedCount = (k && typeof state.revealed[k] === 'number') ? state.revealed[k] : 0;
    if (revealedCount < total) {
      pbarAdvance.textContent = `Reveal ${revealedCount + 1} of ${total}`;
      pbarAdvance.disabled = false;
    } else if (state.current === slides.length - 1) {
      pbarAdvance.textContent = 'End';
      pbarAdvance.disabled = true;
    } else {
      pbarAdvance.textContent = 'Next →';
      pbarAdvance.disabled = false;
    }
  } else if (rankList) {
    const total = parseInt(rankList.dataset.rankTotal, 10) || 0;
    const k = slideKey(state.current);
    const revealedCount = (k && typeof state.revealed[k] === 'number') ? state.revealed[k] : 0;
    if (revealedCount < total) {
      pbarAdvance.textContent = `Reveal #${revealedCount + 1} of ${total}`;
      pbarAdvance.disabled = false;
    } else if (state.current === slides.length - 1) {
      pbarAdvance.textContent = 'End';
      pbarAdvance.disabled = true;
    } else {
      pbarAdvance.textContent = 'Next →';
      pbarAdvance.disabled = false;
    }
  } else if (hlStage3) {
    const hlItems = hlStage3.querySelectorAll('.q-hl-item-card');
    const maxStepHL = hlItems.length * 2 - 1;
    const k2 = slideKey(state.current);
    const curStepHL = (k2 && typeof state.revealed[k2] === 'number') ? state.revealed[k2] : -1;
    if (curStepHL < maxStepHL) {
      const nextStep = curStepHL + 1;
      const isRevealStep = nextStep % 2 === 1; // odd steps reveal
      const itemNum = Math.floor(nextStep / 2) + 1;
      pbarAdvance.textContent = isRevealStep ? `Reveal Item ${itemNum}` : `Show Item ${itemNum}`;
      pbarAdvance.disabled = false;
    } else if (state.current === slides.length - 1) {
      pbarAdvance.textContent = 'End';
      pbarAdvance.disabled = true;
    } else {
      pbarAdvance.textContent = 'Next →';
      pbarAdvance.disabled = false;
    }
  } else if (cur && cur.classList.contains('q-slide') && !cur.classList.contains('revealed')) {
    pbarAdvance.textContent = 'Reveal';
    pbarAdvance.disabled = false;
  } else if (cur && state.current === slides.length - 1) {
    pbarAdvance.textContent = 'End';
    pbarAdvance.disabled = true;
  } else {
    pbarAdvance.textContent = 'Next →';
    pbarAdvance.disabled = false;
  }
  pbarPrev.disabled = state.current <= 1;
  pbarNext.disabled = state.current >= slides.length - 1;
  pbarScores.disabled = !state.scoring || !state.contestants.length || (cur && cur.dataset.type === 'scores');
  // Show tiebreaker button only when episode has tiebreaker questions
  const hasTiebreakerQ = !!(currentEpisode && currentEpisode.questions.some(q => q.type === 'tiebreaker'));
  if (pbarTiebreaker) {
    pbarTiebreaker.style.display = hasTiebreakerQ ? '' : 'none';
    pbarTiebreaker.disabled = !hasTiebreakerQ || (cur && cur.dataset.type === 'tiebreaker');
    pbarTiebreaker.textContent = state.tiebreakerInjected ? '⚡ Tiebreaker (active)' : '⚡ Tiebreaker';
  }

  // Scoreboard
  renderPresenterScoreboard();

  // Host notes for this slide
  let notes = '';
  if (cur && cur.dataset.qid && currentEpisode) {
    const q = currentEpisode.questions.find(x => x.id === cur.dataset.qid);
    if (q && q.host_notes) notes = q.host_notes;
  }
  psNotes.innerHTML = safeRich(notes);

  // Meta panel: slide kind, source, etc.
  psMeta.innerHTML = renderSlideMeta(cur);
}

function renderSlideMeta(slide) {
  if (!slide) return '<em>—</em>';
  if (slide.dataset.type === 'question' && currentEpisode) {
    const q = currentEpisode.questions.find(x => x.id === slide.dataset.qid);
    if (!q) return '';
    let parts = [];
    parts.push(`<strong>${escHtml(formatLabelForType(q.type))}</strong>`);
    if ((q.type === 'two_choice' || q.type === 'multiple_choice') && Array.isArray(q.options)) {
      const correct = q.options[q.correct];
      if (correct) parts.push(`Correct: <strong>${String.fromCharCode(65 + q.correct)} — ${escHtml(correct.text || '')}</strong>${correct.pct != null ? ` (${correct.pct}%)` : ''}`);
    } else if (q.type === 'over_under') {
      parts.push(`Anchor: <strong>${q.number}%</strong>, correct: <strong>${q.correct}</strong>${q.actual != null ? `, actual: <strong>${q.actual}%</strong>` : ''}`);
    } else if (q.type === 'guess_pct') {
      if (q.answer != null) parts.push(`Answer: <strong>${q.answer}%</strong>`);
    } else if (q.type === 'name_as_many') {
      if (Array.isArray(q.answers) && q.answers.length) parts.push(`<strong>${q.answers.length}</strong> answers in list`);
    } else if (q.type === 'guess_breakdown' && Array.isArray(q.options)) {
      parts.push(q.options.map(o => `${escHtml(o.label || '')}: <strong>${o.pct}%</strong>`).join(' · '));
    } else if (q.type === 'ranking' && Array.isArray(q.items)) {
      parts.push('<strong>Correct order:</strong><br>' + q.items.map((it, i) => `${i + 1}. ${escHtml(it.name || '')}${it.stat ? ` <span style="color:var(--text-muted);">— ${escHtml(it.stat)}</span>` : ''}`).join('<br>'));
    }
    if (q.source) parts.push(`<em style="font-style:italic; color:var(--text-muted);">${escHtml(q.source)}</em>`);
    return parts.join('<br>');
  }
  if (slide.dataset.type === 'scores') return '<strong>Scores Slide</strong> — synthetic, will be removed when you advance.';
  if (slide.dataset.type === 'content' && currentEpisode) {
    const q = currentEpisode.questions.find(x => x.id === slide.dataset.qid);
    if (!q) return '';
    const typeLabel = q.type.replace(/^content_/, '').replace(/_/g, ' ');
    let parts = [`<strong>Content slide — ${escHtml(typeLabel)}</strong>`];
    if (q.heading) parts.push(escHtml(q.heading.slice(0, 80)));
    return parts.join('<br>');
  }
  if (slide.dataset.type === 'contestant' && currentEpisode) {
    const idx = parseInt(slide.dataset.cidx, 10);
    const c = currentEpisode.contestants && currentEpisode.contestants[idx];
    if (c) return `<strong>Contestant intro ${idx + 1}</strong>: ${escHtml(c.name)}`;
  }
  if (slide.dataset.type === 'static') return '<em style="color:var(--text-muted);">Framing slide</em>';
  return '';
}

function renderPresenterScoreboard() {
  if (!psScoreboard) return;
  if (!state.scoring || !state.contestants.length) {
    psScoreboard.innerHTML = '<em style="color:var(--text-muted); font-size:13px;">No contestants — present-only mode.</em>';
    return;
  }
  const maxScore = Math.max(...state.contestants.map(c => c.score));
  psScoreboard.innerHTML = '';
  state.contestants.forEach((c, i) => {
    const isLeading = c.score === maxScore && maxScore > 0;
    const row = document.createElement('div');
    row.className = 'sb-row' + (isLeading ? ' leading' : '');
    row.innerHTML = `
      <button class="sb-btn minus" data-i="${i}" data-d="-1" title="−1">−</button>
      <span class="sb-name">${escHtml(c.name)}</span>
      <span class="sb-pts">${c.score}</span>
      <button class="sb-btn sb-plus" data-i="${i}" data-d="1" title="+1">+</button>`;
    psScoreboard.appendChild(row);
  });
  psScoreboard.querySelectorAll('.sb-btn').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      adjustScore(parseInt(b.dataset.i, 10), parseInt(b.dataset.d, 10));
    });
  });
}

// Scale all .slide-frame elements to fit the window while preserving 16:9.
// Frame is fixed at 1280×720 logical pixels; transform:scale makes it fit.
function scaleFrames() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const scale = Math.min(w / 1280, h / 720);
  document.querySelectorAll('.slide-frame').forEach(frame => {
    frame.style.transform = `scale(${scale})`;
  });
}

// Re-fit previews + auto-sized text on window resize
window.addEventListener('resize', () => {
  if (role === 'presenter') updatePresenterSurface();
  scaleFrames();
  fitContestantNames();
});

// Initial scale
scaleFrames();

function newEpisode() {
  const ep = {
    id: newEpisodeId(),
    name: 'Untitled Episode',
    framing: BLANK_FRAMING(),
    contestants: BLANK_CONTESTANTS(),
    questions: []
  };
  upsertEpisode(ep);
  editEpisode(ep);
}

function duplicateDemoEpisode() {
  const ep = JSON.parse(JSON.stringify(DEMO_EPISODE));
  ep.id = newEpisodeId();
  ep.name = 'Copy of Demo Episode';
  delete ep.isDemo;
  upsertEpisode(ep);
  editEpisode(ep);
}

function duplicateEpisodeById(id) {
  const orig = getEpisode(id);
  if (!orig) return;
  const ep = JSON.parse(JSON.stringify(orig));
  ep.id = newEpisodeId();
  ep.name = orig.name + ' (copy)';
  upsertEpisode(ep);
  showStudioList();
}

function deleteEpisodeById(id) {
  const ep = getEpisode(id);
  if (!ep) return;
  if (!confirm(`Delete "${ep.name}"? This cannot be undone.`)) return;
  deleteEpisode(id);
  showStudioList();
}

function exportEpisodeById(id) {
  const ep = getEpisode(id);
  if (!ep) return;
  const data = JSON.stringify(ep, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = (ep.name || 'episode').replace(/[^a-z0-9_-]+/gi, '_').toLowerCase() + '.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

document.getElementById('import-file').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const ep = JSON.parse(reader.result);
      if (!ep.id || !ep.name || !Array.isArray(ep.questions)) throw new Error('Invalid episode file.');
      ep.id = newEpisodeId();
      ep.name = ep.name + ' (imported)';
      delete ep.isDemo;
      if (!ep.framing) ep.framing = BLANK_FRAMING();
      migrateEpisode(ep);
      upsertEpisode(ep);
      if (studioEl.classList.contains('visible')) showStudioList();
      else showPicker();
      alert(`Imported "${ep.name}".`);
    } catch (err) { alert('Could not import file: ' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

function editEpisodeById(id) {
  const ep = getEpisode(id);
  if (!ep) return;
  editEpisode(ep);
}

function editEpisode(ep) {
  editingEp = JSON.parse(JSON.stringify(migrateEpisode(ep)));
  editingQId = editingEp.questions[0]?.id || null;
  editorTab = 'questions';
  renderEditor();
}

function renderEditor() {
  studioActions.innerHTML = `
    <button class="btn btn-sm" id="st-back">← Episodes</button>
    <button class="btn btn-sm" id="st-play">Play</button>
    <button class="btn btn-sm btn-primary" id="st-save">Save</button>`;
  document.getElementById('st-back').onclick = () => {
    if (confirm('Discard unsaved changes?')) showStudioList();
  };
  document.getElementById('st-save').onclick = saveEditor;
  document.getElementById('st-play').onclick = () => {
    saveEditor(true);
    closeStudio();
    loadEpisodeForPlay(editingEp.id);
  };

  studioContent.innerHTML = `
    <div class="editor-header">
      <input class="editor-name-input" id="ep-name" value="${escHtml(editingEp.name)}" placeholder="Episode name">
    </div>
    <div class="editor-tabs">
      <button class="tab-btn ${editorTab === 'questions' ? 'active' : ''}" data-tab="questions">Questions</button>
      <button class="tab-btn ${editorTab === 'contestants' ? 'active' : ''}" data-tab="contestants">Contestants</button>
      <button class="tab-btn ${editorTab === 'framing' ? 'active' : ''}" data-tab="framing">Framing</button>
    </div>
    <div class="tab-pane ${editorTab === 'questions' ? 'active' : ''}" id="tab-questions"></div>

    b.onclick = () => { editorTab = b.dataset.tab; renderEditor(); };
  });

  if (editorTab === 'questions') renderQuestionsTab();

function saveEditor(silent) {
  if (!editingEp.name || !editingEp.name.trim()) {
    alert('Please give the episode a name.'); return;
  }
  upsertEpisode(editingEp);
  if (!silent) {
    const btn = document.getElementById('st-save');
    if (btn) {
      const orig = btn.textContent;
      btn.textContent = 'Saved ✓';
      setTimeout(() => { if (btn) btn.textContent = orig; }, 1200);
    }
  }
}

          <div class="ct-row-actions">
            <button class="btn btn-sm" data-act="up" data-i="${i}" ${i === 0 ? 'disabled' : ''}>↑</button>
            <button class="btn btn-sm" data-act="down" data-i="${i}" ${i === cs.length - 1 ? 'disabled' : ''}>↓</button>
            <button class="btn btn-sm btn-danger" data-act="delete" data-i="${i}">Delete</button>
          </div>
        </div>
      </div>`;
    }).join('');

    // Wire up name/subtext inputs (live update)
    list.querySelectorAll('[data-ct-name]').forEach(inp => {
      inp.addEventListener('input', () => { cs[parseInt(inp.dataset.ctName, 10)].name = inp.value; });
    });
    list.querySelectorAll('[data-ct-subtext]').forEach(ta => {
      ta.addEventListener('input', () => { cs[parseInt(ta.dataset.ctSubtext, 10)].subtext = ta.value; });
    });
    // Wire up action buttons
    list.querySelectorAll('[data-act]').forEach(btn => {
      btn.onclick = () => {
        const i = parseInt(btn.dataset.i, 10);
        const act = btn.dataset.act;
        if (act === 'upload') return triggerPhotoUpload(i);
        if (act === 'remove-photo') {
          if (!confirm('Remove this contestant\'s photo?')) return;
          cs[i].photoUrl = null;
          renderContestantList();
          return;
        }
        if (act === 'up' && i > 0) {
          [cs[i - 1], cs[i]] = [cs[i], cs[i - 1]];
          renderContestantList();
          return;
        }
        if (act === 'down' && i < cs.length - 1) {
          [cs[i + 1], cs[i]] = [cs[i], cs[i + 1]];
          renderContestantList();
          return;
        }
        if (act === 'delete') {
          if (!confirm(`Delete "${cs[i].name || 'contestant ' + (i + 1)}"?`)) return;
          cs.splice(i, 1);
          renderContestantList();
          return;
        }
      };
    });
  }
}
