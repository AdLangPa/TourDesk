<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Non-Census</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Lora:ital,wght@0,500;0,700;1,500;1,700&family=IBM+Plex+Mono:wght@400;500;600&family=Public+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/* ─────── PALETTE — Cold Intelligence ─────── */
:root {
  /* Brand tokens */
  --manila: #f0e5ca;
  --paper-bright: #faf7ef;
  --paper-cool: #e9edf0;
  --ink: #151a1d;
  --ink-soft: #2a3238;
  --brick: #b1312c;
  --brick-deep: #7a1f1b;
  --steel: #2f5d7a;
  --steel-deep: #1f3e52;
  --gray-rule: #6b737a;
  --gray-muted: #8a9298;
  /* Compatibility aliases */
  --paper: var(--manila);
  --red: var(--brick);
  --yellow: var(--paper-cool);
  --bg: var(--manila);
  --surface: var(--paper-bright);
  --surface-2: var(--paper-cool);
  --surface-3: #dce2e6;
  --surface-hover: #f5f0e4;
  --input-bg: var(--paper-bright);
  --text: var(--ink);
  --text-off: var(--ink-soft);
  --text-muted: var(--gray-muted);
  --text-subtle: var(--gray-rule);
  --border-subtle: rgba(21,26,29,0.08);
  --border: rgba(21,26,29,0.18);
  --border-strong: rgba(21,26,29,0.40);
  --border-bold: var(--ink);
  --accent: var(--brick);
  --accent-hover: var(--brick-deep);
  --accent-tint: rgba(177,49,44,0.08);
  --accent-soft: rgba(177,49,44,0.04);
  --danger: var(--brick);
  --danger-tint: rgba(177,49,44,0.10);
  --shadow: 0 1px 0 var(--ink);
  --hard-shadow: 3px 3px 0 var(--ink);
  /* Type stack */
  --display: 'Playfair Display', Georgia, serif;
  --serif: 'Lora', Georgia, serif;
  --mono: 'IBM Plex Mono', ui-monospace, monospace;
  --sans: 'Public Sans', sans-serif;
}

html, body {
  width: 100%; height: 100%;
  background: var(--paper); color: var(--ink);
  font-family: var(--serif);
  overflow: hidden; user-select: none;
  text-align: center;
}

/* Halftone + texture utilities — used throughout */
/* halftone utilities removed — Cold Intelligence uses grid texture */

/* Page-level texture: grid + dots + scattered maple leaves (1 in 5) */
body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none;
  background-image: url("data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240"><circle cx="0" cy="0" r="1.2" fill="%23151a1d"/><circle cx="48" cy="0" r="1.2" fill="%23151a1d"/><circle cx="96" cy="0" r="1.2" fill="%23151a1d"/><circle cx="192" cy="0" r="1.2" fill="%23151a1d"/><circle cx="0" cy="48" r="1.2" fill="%23151a1d"/><circle cx="96" cy="48" r="1.2" fill="%23151a1d"/><circle cx="144" cy="48" r="1.2" fill="%23151a1d"/><circle cx="192" cy="48" r="1.2" fill="%23151a1d"/><circle cx="0" cy="96" r="1.2" fill="%23151a1d"/><circle cx="48" cy="96" r="1.2" fill="%23151a1d"/><circle cx="96" cy="96" r="1.2" fill="%23151a1d"/><circle cx="144" cy="96" r="1.2" fill="%23151a1d"/><circle cx="0" cy="144" r="1.2" fill="%23151a1d"/><circle cx="48" cy="144" r="1.2" fill="%23151a1d"/><circle cx="144" cy="144" r="1.2" fill="%23151a1d"/><circle cx="192" cy="144" r="1.2" fill="%23151a1d"/><circle cx="48" cy="192" r="1.2" fill="%23151a1d"/><circle cx="96" cy="192" r="1.2" fill="%23151a1d"/><circle cx="144" cy="192" r="1.2" fill="%23151a1d"/><circle cx="192" cy="192" r="1.2" fill="%23151a1d"/><path d="M0,-8 L-1.5,-4.5 L-5,-5.5 L-3,-2.5 L-8,-1 L-4.5,0.5 L-6,4 L-2.5,3 L-3,8 L0,6 L3,8 L2.5,3 L6,4 L4.5,0.5 L8,-1 L3,-2.5 L5,-5.5 L1.5,-4.5 Z" transform="translate(144,0) scale(0.55)" fill="%23151a1d"/><path d="M0,-8 L-1.5,-4.5 L-5,-5.5 L-3,-2.5 L-8,-1 L-4.5,0.5 L-6,4 L-2.5,3 L-3,8 L0,6 L3,8 L2.5,3 L6,4 L4.5,0.5 L8,-1 L3,-2.5 L5,-5.5 L1.5,-4.5 Z" transform="translate(48,48) scale(0.55)" fill="%23151a1d"/><path d="M0,-8 L-1.5,-4.5 L-5,-5.5 L-3,-2.5 L-8,-1 L-4.5,0.5 L-6,4 L-2.5,3 L-3,8 L0,6 L3,8 L2.5,3 L6,4 L4.5,0.5 L8,-1 L3,-2.5 L5,-5.5 L1.5,-4.5 Z" transform="translate(192,96) scale(0.55)" fill="%23151a1d"/><path d="M0,-8 L-1.5,-4.5 L-5,-5.5 L-3,-2.5 L-8,-1 L-4.5,0.5 L-6,4 L-2.5,3 L-3,8 L0,6 L3,8 L2.5,3 L6,4 L4.5,0.5 L8,-1 L3,-2.5 L5,-5.5 L1.5,-4.5 Z" transform="translate(96,144) scale(0.55)" fill="%23151a1d"/><path d="M0,-8 L-1.5,-4.5 L-5,-5.5 L-3,-2.5 L-8,-1 L-4.5,0.5 L-6,4 L-2.5,3 L-3,8 L0,6 L3,8 L2.5,3 L6,4 L4.5,0.5 L8,-1 L3,-2.5 L5,-5.5 L1.5,-4.5 Z" transform="translate(0,192) scale(0.55)" fill="%23151a1d"/></svg>");
  background-size: 240px 240px;
  opacity: 0.18;
  z-index: 0;
}

#deck { width: 100%; height: 100%; position: relative; }


/* ─────── SLIDES ─────── */
.slide {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding: 0;
  opacity: 0; pointer-events: none;
  transition: opacity 0.35s ease;
  overflow: hidden;
  background: var(--bg);
}
.slide.active { opacity: 1; pointer-events: all; }

/* Frame is fixed at 1280×720 logical pixels. JS scales it to fit the window via
   transform:scale, keeping it centered. cqmin inside resolves to 7.2px always. */
.slide-frame {
  width: 1280px;
  height: 720px;
  flex-shrink: 0;
  position: relative;
  container-type: size;
  container-name: frame;
  overflow: hidden;
  background: var(--bg);
  transform-origin: center center;
  /* Centering fallback for when JS hasn't run yet */
  display: grid; align-content: center;
  text-align: center;
}
.slide-frame > * { text-align: center; width: 100%; }

/* Question slides: flex column, vertically centered, left-aligned content */
.q-slide .slide-frame {
  display: flex; flex-direction: column;
  justify-content: center; align-items: stretch;
  text-align: left;
  padding: 40px 72px 56px;
  gap: 24px;
}
.q-slide .slide-frame > * { width: 100%; }

/* ─────── NAV / HINT ─────── */
#nav {
  position: fixed; bottom: 28px; left: 0; right: 0;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  z-index: 100; flex-wrap: wrap; padding: 0 20px;
}
.nav-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--border-strong); transition: background 0.2s, transform 0.2s; cursor: pointer;
}
.nav-dot.active { background: var(--text); transform: scale(1.3); }

#hint {
  position: fixed; bottom: 28px; right: 24px;
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.2em; color: var(--text-muted); text-transform: uppercase;
  z-index: 100;
}

/* ─────── PICKER ─────── */
.picker-inner { max-width: 720px; margin: 0 auto; }
.picker-logo {
  font-family: var(--mono);
  font-size: 14px; font-weight: 700; letter-spacing: 0.4em;
  color: var(--text-muted); text-transform: uppercase; margin-bottom: 24px;
}
.picker-title {
  font-family: var(--mono);
  font-size: clamp(32px, 5vw, 52px); font-weight: 900;
  color: var(--text); margin-bottom: 8px;
}
.picker-sub { font-size: 15px; color: var(--text-off); margin-bottom: 32px; }
.episode-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px; margin-bottom: 24px; text-align: left;
}
.episode-card {
  padding: 18px 20px; border: 1px solid var(--border); background: var(--surface);
  cursor: pointer; transition: border-color 0.15s, background 0.15s;
  display: flex; flex-direction: column; gap: 6px;
}
.episode-card:hover { border-color: var(--accent); background: var(--surface-hover); }
.episode-card.demo { border-style: dashed; }
.ep-name {
  font-family: var(--mono); font-size: 20px;
  font-weight: 800; color: var(--text); text-transform: uppercase;
  letter-spacing: 0.04em;
}
.ep-meta {
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.25em; color: var(--text-muted); text-transform: uppercase;
}
.picker-actions {
  display: flex; gap: 12px; justify-content: center; margin-top: 12px;
  flex-wrap: wrap;
}

/* ─────── BUTTONS ─────── */
.btn {
  font-family: var(--mono); font-size: 14px; font-weight: 700;
  letter-spacing: 0.2em; text-transform: uppercase;
  padding: 12px 24px; border: 1px solid var(--border); background: transparent;
  color: var(--text); cursor: pointer; transition: all 0.15s;
}
.btn:hover { border-color: var(--border-bold); background: var(--surface-hover); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-danger { color: var(--danger); border-color: var(--danger); }
.btn-danger:hover { background: var(--danger-tint); color: var(--danger); border-color: var(--danger); }
.btn-sm { font-size: 11px; padding: 6px 12px; letter-spacing: 0.15em; }

/* ─────── SETUP ─────── */
.setup-inner { max-width: 600px; margin: 0 auto; }
.setup-eyebrow {
  font-family: var(--mono);
  font-size: 11px; font-weight: 700; letter-spacing: 0.4em;
  color: var(--accent); text-transform: uppercase; margin-bottom: 12px;
}
.setup-title {
  font-family: var(--mono);
  font-size: clamp(32px, 5vw, 52px); font-weight: 900;
  color: var(--text); margin-bottom: 8px;
}
.setup-sub { font-size: 15px; color: var(--text-off); margin-bottom: 32px; }
.setup-roster {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px; margin-bottom: 28px; max-width: 540px; margin-left: auto; margin-right: auto;
}
.setup-roster-card {
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  padding: 18px; border: 1px solid var(--border); background: var(--surface);
}
.setup-roster-photo {
  width: 96px; height: 96px;
  object-fit: cover; border-radius: 50%;
  background: var(--surface-2); border: 1px solid var(--border);
  display: block;
}
.setup-roster-photo-placeholder {
  display: flex; align-items: center; justify-content: center;
  color: var(--text-subtle);
}
.setup-roster-photo-placeholder svg { width: 50%; height: 50%; }
.setup-roster-name {
  font-family: var(--mono);
  font-size: 22px; font-weight: 800; color: var(--text);
  text-transform: uppercase; letter-spacing: 0.04em;
}
.setup-empty {
  padding: 24px; margin-bottom: 28px;
  border: 1px dashed var(--border); background: var(--surface);
  color: var(--text-muted); font-style: italic;
  font-size: 14px;
}
.setup-actions { display: flex; flex-direction: column; gap: 10px; }
.setup-btn {
  background: var(--accent); color: #fff;
  font-family: var(--mono); font-size: 20px; font-weight: 800;
  letter-spacing: 0.15em; text-transform: uppercase;
  padding: 16px 48px; border: none; cursor: pointer;
  transition: background 0.2s; width: 100%;
}
.setup-btn:hover:not([disabled]) { background: var(--accent-hover); }
.setup-btn[disabled] { opacity: 0.4; cursor: not-allowed; }
.setup-link {
  font-size: 13px; color: var(--text-muted);
  cursor: pointer; text-decoration: underline; background: none; border: none;
  font-family: inherit;
}
.setup-link:hover { color: var(--text-off); }

/* ─────── TITLE ─────── */
.slide.title-slide { background: var(--manila); }
.slide.title-slide .slide-frame::before {
  content: ''; position: absolute; inset: 0;
  background-image:
    linear-gradient(to right, rgba(21,26,29,0.05) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(21,26,29,0.05) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
}
.slide.title-slide .slide-frame::after { content: none; }
/* Chrome decorations removed: sparks, tape strips, torn band, "No. 003" text */
.title-spark, .title-tape, .title-band, .title-band-text { display: none !important; }
.wordmark {
  font-family: var(--display);
  font-size: 101px; font-weight: 800;
  letter-spacing: -0.015em; line-height: 0.85; color: var(--ink);
  position: relative; z-index: 4;
  text-align: center;
}
.wordmark .splat {
  display: inline-block;
  background: var(--brick); color: var(--manila);
  padding: 0 0.08em;
  transform: none;
  margin: 0 -0.04em;
}
.wordmark span { color: var(--brick); }
.wordmark-logo {
  display: block; margin: 0 auto;
  max-width: 80%; max-height: 324px;
  width: auto; height: auto;
  object-fit: contain;
  position: relative; z-index: 4;
}
.tagline {
  margin-top: 17px; font-family: var(--mono);
  font-size: 12px; font-weight: 500;
  letter-spacing: 0.3em; color: var(--steel); text-transform: uppercase;
  position: relative; z-index: 4;
  display: inline-block; padding: 4px 0;
  transform: none;
}

/* ─────── CONTESTANT SLIDE ─────── */
.slide[data-type="contestant"] { background: var(--paper); }
.slide[data-type="contestant"] .slide-frame::before {
  content: ''; position: absolute; inset: 0;
  background-image:
    linear-gradient(to right, rgba(21,26,29,0.04) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(21,26,29,0.04) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none;
}
.contestant-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
  align-items: center;
  gap: 36px;
  width: 100%;
}
.contestant-photo-wrap {
  display: flex; align-items: center; justify-content: center;
  position: relative;
}
.contestant-photo-wrap::before,
.contestant-photo-wrap::after { content: none; }
.contestant-photo {
  width: 100%; max-width: 317px;
  aspect-ratio: 1 / 1; object-fit: cover;
  border: 2px solid var(--ink);
  background: var(--surface-2);
  display: block; position: relative; z-index: 2;
}
.contestant-photo-placeholder {
  display: flex; align-items: center; justify-content: center;
  color: var(--text-subtle);
}
.contestant-photo-placeholder svg { width: 45%; height: 45%; }
.slide[data-type="contestant"] .slide-frame {
  padding: 48px 64px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.contestant-text { text-align: left; }
/* "Contestant X of Y" eyebrow — hidden, generated text */
.contestant-eyebrow { display: none !important; }
.contestant-name {
  font-family: var(--display);
  font-size: 72px; font-weight: 800;
  line-height: 0.9; color: var(--ink);
  letter-spacing: -0.015em;
  margin-bottom: 17px;
  text-transform: uppercase;
}
.contestant-subtext {
  font-family: var(--serif);
  font-size: 22px; font-weight: 400;
  line-height: 1.45; color: var(--ink); opacity: 0.85;
}
.contestant-subtext em { color: var(--red); font-style: italic; font-weight: 700; }
.contestant-subtext strong { color: var(--ink); font-weight: 700; }

/* ─────── QUESTIONS ─────── */
/* q-slide layout is handled by .q-slide .slide-frame above */
.slide.q-slide { background: var(--paper); }
.slide.q-slide .slide-frame::before {
  content: ''; position: absolute; inset: 0;
  background-image:
    linear-gradient(to right, rgba(21,26,29,0.04) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(21,26,29,0.04) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none; z-index: 0;
}
.slide.q-slide .slide-frame > * { position: relative; z-index: 1; width: 100%; }
.q-format-label { display: none !important; }
.q-text {
  font-family: var(--serif); font-style: italic;
  font-size: 82px; font-weight: 700;
  line-height: 1.04; color: var(--ink);
  letter-spacing: -0.015em;
  text-align: center !important;
  text-wrap: balance;
  overflow-wrap: break-word;
  flex: 0 1 auto;
}
.q-text em { font-style: italic; color: var(--ink); font-weight: 900; }
.q-text strong { color: var(--ink); font-weight: 900; }
.q-slide.revealed .q-text { font-size: 58px; }
.q-slide.revealed.q-name-slide .q-text { font-size: 44px; }
.q-slide.revealed.q-guess-slide .q-text { font-size: 58px; }
.q-slide.revealed.q-break-slide .q-text { font-size: 52px; }
.q-text-sm {
  font-family: var(--serif); font-style: italic;
  font-size: 70px; font-weight: 700;
  line-height: 1.05; color: var(--ink); letter-spacing: -0.015em;
  text-align: center !important;
  text-wrap: balance;
  overflow-wrap: break-word;
}
.q-slide.revealed .q-text-sm { font-size: 50px; }
.q-slide.revealed.q-name-slide .q-text-sm { font-size: 36px; }
.q-slide.revealed.q-guess-slide .q-text-sm { font-size: 50px; }
.q-source { display: none; }
/* ── Cloud Sync Modal ── */
#cloud-overlay {
  position: fixed; inset: 0; z-index: 9000;
  background: rgba(0,0,0,0.55);
  display: flex; align-items: center; justify-content: center;
}
#cloud-modal {
  background: var(--surface); border: 3px solid var(--ink);
  box-shadow: 6px 6px 0 var(--ink);
  width: min(520px, 90vw); max-height: 80vh;
  display: flex; flex-direction: column;
  overflow: hidden;
}
#cloud-modal-title {
  background: var(--ink); color: var(--manila);
  font-family: var(--mono); font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase;
  padding: 10px 16px; flex-shrink: 0;
}
#cloud-modal-body {
  padding: 18px; overflow-y: auto; flex: 1;
  font-family: var(--mono); font-size: 13px;
}
#cloud-modal-body p { line-height: 1.5; }
#cloud-ep-list { display: flex; flex-direction: column; gap: 6px; }
.cloud-ep-row {
  display: flex; align-items: center; gap: 8px;
  padding: 6px 10px; border: 1px solid var(--border); background: var(--surface-2);
}
.cloud-ep-name { flex: 1; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cloud-ep-badge {
  font-size: 10px; padding: 2px 6px; letter-spacing: 0.05em; text-transform: uppercase;
  border: 1px solid var(--border); white-space: nowrap;
}
.cloud-ep-badge.local { background: var(--yellow); border-color: var(--ink); }
.cloud-ep-badge.cloud-only { background: var(--surface); color: var(--text-muted); }
#cloud-status { margin-bottom: 10px; }
.q-source-strip {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
  padding: 5px 14px;
  background: rgba(26,24,20,0.06);
  border-top: 1px solid rgba(26,24,20,0.12);
  flex: 0 0 auto;
  position: absolute;
  bottom: 0; left: 0; right: 0;
}
.q-source-text {
  font-family: var(--mono); font-size: 11px;
  color: var(--steel); opacity: 0.85;
  letter-spacing: 0.04em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 70%;
  text-align: right;
}
.q-source-logo {
  height: 42px; width: auto;
  object-fit: contain;
  opacity: 0.75;
  flex-shrink: 0;
}


/* Two-choice */
.q-options {
  display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  width: 100%;
}
.q-option {
  position: relative;
  padding: 28px 32px;
  border: 2px solid var(--gray-rule);
  background: var(--paper-bright);
  text-align: center;
  transition: border-color 0.3s ease, background 0.3s ease, opacity 0.3s ease;
}
.q-option.q-option-a { }
.q-option.q-option-b { }
.q-option-label {
  font-family: var(--mono); font-size: 13px; font-weight: 500;
  letter-spacing: 0.3em; color: var(--steel); text-transform: uppercase;
  margin-bottom: 8px;
}
.q-option-text {
  font-family: var(--sans);
  font-size: 34px; font-weight: 700;
  color: var(--ink); line-height: 1.05;
  text-transform: uppercase; letter-spacing: 0.04em;
}
.q-option-pct {
  font-family: var(--mono);
  font-size: 64px; font-weight: 600;
  color: var(--brick); margin-top: 10px; line-height: 0.9;
  opacity: 0; transform: translateY(6px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.revealed .q-option { transition: border-color 0.4s ease, background 0.4s ease, opacity 0.4s ease; }
.revealed .q-option.winner {
  background: var(--paper-bright); border-color: var(--brick);
  border-width: 2px; z-index: 4;
}
.revealed .q-option:not(.winner) { opacity: 0.55; }
.revealed .q-option-pct { opacity: 1; transform: translateY(0); }
.revealed .q-option.winner .q-option-pct { color: var(--brick); }
.q-slide.revealed::after { content: none; }
.q-slide .reveal-burst { display: none; }
.q-slide.revealed > .slide-frame > .reveal-burst { display: none; }

/* Multiple Choice — stacked list of 2–6 options */
.q-mc-options {
  display: flex; flex-direction: column; gap: 10px;
  width: 100%;
}
.q-mc-option {
  display: flex; align-items: center; gap: 20px;
  padding: 14px 24px;
  border: 2px solid var(--gray-rule);
  background: var(--paper-bright);
  transition: border-color 0.4s ease, background 0.4s ease, opacity 0.4s ease;
}
.q-mc-label {
  font-family: var(--mono); font-size: 16px; font-weight: 600;
  letter-spacing: 0.3em; color: var(--steel); text-transform: uppercase;
  flex-shrink: 0; width: 28px; text-align: center;
}
.q-mc-text {
  font-family: var(--sans); font-size: 36px; font-weight: 700;
  color: var(--ink); line-height: 1.1;
  text-transform: uppercase; letter-spacing: 0.03em; flex: 1;
}
.q-mc-pct {
  font-family: var(--mono); font-size: 52px; font-weight: 600;
  color: var(--brick); line-height: 0.9; flex-shrink: 0;
  opacity: 0; transform: translateX(8px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.revealed .q-mc-option.winner { border-color: var(--brick); }
.revealed .q-mc-option:not(.winner) { opacity: 0.45; }
.revealed .q-mc-pct { opacity: 1; transform: translateX(0); }
.revealed .q-mc-option.winner .q-mc-pct { color: var(--brick); }

/* Over or Under */
.q-ou-options { display: flex; gap: 20px; justify-content: center; width: 100%; }
.q-ou-btn {
  font-family: var(--sans); font-size: 32px; font-weight: 700;
  letter-spacing: 0.05em; text-transform: uppercase; padding: 16px 56px;
  border: 2px solid var(--gray-rule); color: var(--steel); background: var(--paper-bright);
  transition: all 0.3s;
}
/* Number area: baseline + actual stacked */
.q-ou-number-wrap {
  display: flex; flex-direction: column; align-items: center;
  width: 100%; gap: 0;
}
.q-ou-number {
  font-family: var(--mono);
  font-size: 160px; font-weight: 600;
  color: var(--ink); line-height: 0.9;
  text-align: center;
  position: relative; display: inline-block;
}
/* Red pen scratch — diagonal line through baseline on reveal */
.q-ou-number::after {
  content: '';
  position: absolute;
  left: -6%; top: 52%;
  width: 112%; height: 10px;
  background: var(--red);
  border-radius: 5px;
  transform: rotate(-6deg) translateY(-50%);
  opacity: 0;
  transition: opacity 0.25s ease 0.1s;
}
.revealed .q-ou-number::after { opacity: 1; }
/* Actual answer number — hidden pre-reveal, appears in red below */
.q-ou-actual {
  font-family: var(--mono);
  font-size: 120px; font-weight: 600;
  color: var(--brick); line-height: 0.9;
  text-align: center;
  opacity: 0; transform: translateY(8px);
  transition: opacity 0.4s ease 0.25s, transform 0.4s ease 0.25s;
}
.revealed .q-ou-actual { opacity: 1; transform: translateY(0); }
.revealed .winner-ou {
  background: var(--paper-bright); color: var(--brick); border-color: var(--brick);
}
.revealed .q-ou-options .q-ou-btn:not(.winner-ou) { opacity: 0.4; }
/* Legacy note — hidden in new design */
.q-ou-answer { display: none !important; }

/* Guess-the-percentage */
.q-guess-answer {
  font-family: var(--mono);
  font-size: 200px; font-weight: 600;
  color: var(--brick); line-height: 0.9;
  text-align: center; width: 100%;
  opacity: 0; transform: translateY(7px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.revealed .q-guess-answer { opacity: 1; transform: translateY(0); }
.q-guess-note {
  font-family: var(--serif); font-style: italic;
  font-size: 19px; color: var(--ink);
  text-align: center; width: 100%;
  opacity: 0; transition: opacity 0.5s ease 0.15s;
}
.q-guess-note strong { color: var(--red); }
.revealed .q-guess-note { opacity: 1; }

/* Tiebreaker */
.q-tiebreaker-label {
  font-family: var(--mono); font-size: 13px; font-weight: 600;
  letter-spacing: 0.25em; text-transform: uppercase;
  background: var(--steel); color: var(--paper-bright);
  padding: 6px 20px; text-align: center; width: 100%;
}
.q-tiebreaker-answer {
  font-family: var(--mono);
  font-size: 200px; font-weight: 600;
  color: var(--brick); line-height: 0.9;
  text-align: center; width: 100%;
  opacity: 0; transform: translateY(7px);
  transition: opacity 0.5s ease, transform 0.5s ease;
}
.revealed .q-tiebreaker-answer { opacity: 1; transform: translateY(0); }
/* ─────── HIGHER OR LOWER ─────── */
.q-hl-slide .slide-frame {
  padding: 36px 72px 60px;
  gap: 12px;
}
.q-hl-history { display: none !important; }
.q-hl-history-item {
  display: grid; grid-template-columns: 1fr auto auto;
  align-items: center; gap: 16px;
  padding: 6px 0;
  border-bottom: 1px solid var(--border-subtle);
}
.q-hl-h-name {
  font-family: var(--sans); font-size: 15px; font-weight: 500;
  color: var(--gray-muted); text-transform: uppercase; letter-spacing: 0.06em;
}
.q-hl-h-dir {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  color: var(--steel); letter-spacing: 0.15em; text-transform: uppercase;
}
.q-hl-h-pct {
  font-family: var(--mono); font-size: 15px; font-weight: 600;
  color: var(--brick); letter-spacing: 0.04em;
}
.q-hl-current {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
  width: 100%;
}
.q-hl-item-card {
  display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%;
}
.q-hl-baseline-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.q-hl-baseline-label {
  font-family: var(--mono); font-size: 12px; font-weight: 500;
  letter-spacing: 0.25em; color: var(--steel); text-transform: uppercase;
}
.q-hl-baseline-pct {
  font-family: var(--mono); font-size: 88px; font-weight: 600;
  color: var(--brick); line-height: 0.95;
  letter-spacing: 0.02em;
  transition: color 0.4s ease;
}
.q-hl-item-card.revealed .q-hl-baseline-pct {
  color: var(--ink);
}
.q-hl-item-name {
  font-family: var(--sans);
  font-size: 48px; font-weight: 700;
  color: var(--ink); line-height: 1; text-transform: uppercase;
  letter-spacing: 0.04em; text-align: center;
}
.q-hl-start-wrap { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.q-hl-start-label {
  font-family: var(--mono); font-size: 12px; font-weight: 500;
  letter-spacing: 0.25em; color: var(--steel); text-transform: uppercase;
}
.q-hl-start-pct {
  font-family: var(--mono); font-size: 110px; font-weight: 600;
  color: var(--ink); line-height: 0.9; text-align: center;
}
.q-hl-buttons {
  display: flex; gap: 12px;
}
.q-hl-btn {
  font-family: var(--sans); font-size: 24px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 12px 40px; border: 2px solid var(--gray-rule);
  background: var(--paper-bright); color: var(--ink);
  opacity: 0.7;
  transition: opacity 0.35s ease, background 0.35s ease, color 0.35s ease, border-color 0.35s ease;
}
.q-hl-item-card.revealed .q-hl-btn { opacity: 0.18; }
.q-hl-item-card.revealed .q-hl-btn.correct {
  opacity: 1;
  background: var(--ink); color: var(--paper-bright); border-color: var(--ink);
}
.q-hl-actual {
  font-family: var(--mono); font-size: 96px; font-weight: 600;
  color: var(--brick); line-height: 0.9;
  opacity: 0; transform: translateY(6px);
  transition: opacity 0.4s ease 0.2s, transform 0.4s ease 0.2s;
}
.q-hl-item-card.revealed .q-hl-actual { opacity: 1; transform: translateY(0); }
.q-hl-dir-result {
  font-family: var(--mono); font-size: 18px; font-weight: 600;
  letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--brick);
  opacity: 0; transition: opacity 0.3s ease 0.1s;
}
.q-hl-item-card.revealed .q-hl-dir-result { opacity: 1; }


.q-data-slide .slide-frame {
  display: flex; flex-direction: column;
  justify-content: flex-start; align-items: stretch;
  padding: 32px 64px 28px;
  gap: 12px;
}
.q-data-question {
  font-family: var(--serif); font-style: italic;
  font-size: 34px; font-weight: 900;
  line-height: 1.12; color: var(--ink);
  text-align: center !important;
  text-wrap: balance;
  flex: 0 0 auto;
}
/* Blank underline: always visible pre-reveal */
.q-data-blank {
  display: inline-block;
  min-width: 2em;
  border-bottom: 5px solid var(--ink);
  margin: 0 6px;
  vertical-align: baseline;
}
/* Inline answer (hidden — we use the separate big answer instead) */
.q-data-answer-word { display: none; }
/* Big answer reveal — separate element, appears on reveal */
.q-data-answer-reveal {
  font-family: var(--display);
  font-size: 72px; font-weight: 400;
  color: var(--red);
  text-align: center;
  text-transform: uppercase;
  line-height: 0.95;
  letter-spacing: -0.01em;
  opacity: 0; transform: translateY(8px);
  transition: opacity 0.45s ease, transform 0.45s ease;
  flex: 0 0 auto;
}
.q-data-slide.revealed .q-data-answer-reveal {
  opacity: 1; transform: translateY(0);
}
/* Bar chart area */
.q-data-chart {
  flex: 1 1 0;
  min-height: 0;
  position: relative;
  width: 100%;
}
.q-data-chart svg {
  width: 100%; height: 100%;
  display: block;
}
.q-data-placeholder {
  width: 100%; flex: 1 1 0;
  border: 3px dashed var(--border);
  display: flex; align-items: center; justify-content: center;
  color: var(--text-muted); font-style: italic; font-size: 18px;
}

/* Name as many */
.q-name-prompt {
  font-family: var(--mono);
  font-size: 14px; letter-spacing: 0.3em;
  text-transform: uppercase; color: var(--text-muted); margin-bottom: 14px;
}
.q-name-list {
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: 10px; width: 100%;
  opacity: 0; transition: opacity 0.5s ease;
}
.revealed .q-name-list { opacity: 1; }
.q-name-item {
  padding: 20px 16px;
  border: 3px solid var(--ink); background: var(--surface);
  font-family: var(--display); font-size: 22px; font-weight: 400;
  color: var(--ink); text-align: center; text-transform: uppercase;
  box-shadow: 3px 3px 0 var(--ink);
}
.q-name-item .pct { color: var(--accent); font-weight: 800; margin-left: 8px; }
.q-name-stat {
  font-family: var(--mono); font-size: 28px; font-weight: 700;
  color: var(--text); text-align: center; width: 100%;
  opacity: 0; transition: opacity 0.5s ease 0.1s;
}
.q-name-stat em { font-style: normal; color: var(--accent); }
.revealed .q-name-stat { opacity: 1; }

/* Guess the Breakdown */
.q-break-rows { display: flex; flex-direction: column; gap: 12px; width: 100%; }
.q-break-row {
  display: grid; grid-template-columns: 1fr auto;
  align-items: center; gap: 20px;
  padding: 18px 26px;
  border: 2px solid var(--border); background: var(--surface);
}
.q-break-label {
  font-family: var(--mono); font-size: 28px; font-weight: 700;
  color: var(--text); text-align: left; text-transform: uppercase; letter-spacing: 0.04em;
}
.q-break-pct {
  font-family: var(--mono); font-size: 44px; font-weight: 900;
  color: var(--accent); min-width: 3ch; text-align: right;
  opacity: 0; transform: translateX(-4px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.q-break-row.break-revealed .q-break-pct { opacity: 1; transform: translateX(0); }

/* ─────── RANKING ─────── */
/* Scatter tiles — pre-reveal items floating in stage */
.q-rank-stage {
  position: relative;
  width: 100%;
  flex: 1 1 0;
  min-height: 80px;
}
.q-rank-tile {
  position: absolute;
  left: var(--rx, 50%); top: var(--ry, 50%);
  transform: translate(-50%, -50%) rotate(var(--rrot, 0deg));
  padding: 10px 16px;
  border: 2px solid var(--gray-rule);
  background: var(--paper-bright);
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
  max-width: 200px;
  transition: opacity 0.35s ease, transform 0.35s ease;
}
.q-rank-tile-name {
  font-family: var(--sans); font-size: 20px; font-weight: 700;
  color: var(--ink); text-transform: uppercase;
  letter-spacing: 0.04em; line-height: 1.1;
  overflow-wrap: break-word;
}
.q-rank-tile-stat {
  font-family: var(--mono); font-size: 14px; font-weight: 600;
  color: var(--brick); margin-top: 3px; letter-spacing: 0.04em;
}
/* Compact for 7+ items — slightly smaller so 9 items fit */
.q-rank-stage[data-many="true"] .q-rank-tile {
  padding: 8px 12px; max-width: 210px;
}
.q-rank-stage[data-many="true"] .q-rank-tile-name { font-size: 18px; }
.q-rank-stage[data-many="true"] .q-rank-tile-stat { font-size: 12px; }
.q-rank-tile--gone {
  opacity: 0;
  transform: translate(-50%, -50%) rotate(var(--rrot, 0deg)) scale(0.4);
  pointer-events: none;
}

/* Revealed list — normal flow grid, overlap is impossible */
.q-rank-list {
  width: 100%;
  flex: 0 0 auto;
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
}
.q-rank-list[data-cols="2"] { grid-template-columns: 1fr 1fr; }
.q-rank-list-item {
  display: grid; grid-template-columns: 42px 1fr;
  align-items: center; gap: 10px;
  padding: 10px 18px;
  border: 2px solid var(--gray-rule);
  background: var(--paper-bright);
}
.q-rank-list-item:nth-child(even) { }
.q-rank-list[data-has-stats="true"] .q-rank-list-item {
  grid-template-columns: 42px 1fr auto;
}
@keyframes rank-settle {
  0%   { transform: scale(1.15); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.q-rank-list-item--new { animation: rank-settle 0.35s ease both; }
.q-rank-list-item--new:nth-child(even) { }
.q-rank-num {
  font-family: var(--mono); font-size: 22px; font-weight: 600;
  color: var(--brick); text-align: left; line-height: 1;
}
.q-rank-name {
  font-family: var(--sans); font-size: 20px; font-weight: 700;
  color: var(--ink); text-transform: uppercase;
  letter-spacing: 0.04em; line-height: 1.05;
}
.q-rank-stat {
  font-family: var(--mono); font-size: 14px; color: var(--text-off);
  text-align: right; white-space: nowrap; letter-spacing: 0.04em;
}
/* Compact for 7+ items */
.q-rank-list[data-many="true"] .q-rank-list-item { padding: 7px 14px; gap: 8px; }
.q-rank-list[data-many="true"] .q-rank-num { font-size: 20px; }
.q-rank-list[data-many="true"] .q-rank-name { font-size: 16px; }
.q-rank-list[data-many="true"] .q-rank-stat { font-size: 12px; }
.q-rank-list[data-many="true"] { gap: 4px; }

/* Add scale-up exit animation to tile being revealed */
@keyframes tile-reveal-exit {
  0%   { transform: translate(-50%,-50%) rotate(var(--rrot,0deg)) scale(1); z-index: 20; }
  60%  { transform: translate(-50%,-50%) rotate(0deg) scale(1.9); opacity: 1; z-index: 20; }
  100% { transform: translate(-50%,-50%) rotate(0deg) scale(2.2); opacity: 0; z-index: 20; }
}
.q-rank-tile--exiting {
  animation: tile-reveal-exit 0.45s ease forwards;
  pointer-events: none;
}


/* ─────── CONTENT SLIDES ─────── */
.content-slide-text { width: 100%; text-align: left; }
.content-slide-text.center { text-align: center; }
.content-heading {
  font-family: var(--mono);
  font-size: 43px; font-weight: 900;
  line-height: 1.05; color: var(--text);
  letter-spacing: -0.01em; margin-bottom: 17px;
}
.content-heading em { color: var(--accent); font-style: normal; }
.content-body {
  font-family: var(--serif);
  font-size: 17px;
  line-height: 1.55; color: var(--text-off);
}
.content-body em { color: var(--text); font-style: normal; font-weight: 600; }
.content-body strong { color: var(--text); }
.content-body p + p { margin-top: 1em; }
.content-image-layout {
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
  align-items: center;
  gap: 29px;
  width: 100%;
}
.content-image-wrap { display: flex; align-items: center; justify-content: center; }
.content-image {
  width: 100%; max-width: 100%;
  max-height: 432px; object-fit: contain;
  display: block;
}
.content-image-only {
  display: flex; align-items: center; justify-content: center;
  width: 100%; height: 100%;
}
.content-image-only img {
  max-width: 100%; max-height: 100%;
  object-fit: contain; display: block;
  image-rendering: auto;
}
/* Image-only slides: no padding, image fills the full frame */
.slide[data-content-type="content_image"] .slide-frame {
  padding: 0;
}

/* ─────── CLOSE / LEADERBOARD ─────── */
.slide[data-type="scores"] .slide-frame,
.slide[data-type="static"]#close-slide .slide-frame {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  padding: 60px 80px;
  gap: 0;
}
/* Inner column: constrained width so title + rows never span full frame */
.close-inner {
  width: 100%;
  max-width: 640px;
  display: flex; flex-direction: column;
  align-items: center;
}
.close-title {
  font-family: var(--display);
  font-size: 56px; font-weight: 400;
  line-height: 0.9; color: var(--ink); margin-bottom: 28px;
  letter-spacing: -0.02em; text-transform: uppercase;
  text-align: center; width: 100%;
  word-break: break-word;
}
.close-title em { font-style: italic; color: var(--red); font-family: var(--serif); font-weight: 900; }
.close-body {
  font-family: var(--serif); font-style: italic;
  font-size: 22px; color: var(--ink);
  line-height: 1.4; text-align: center;
}
.close-body em { color: var(--red); font-style: italic; font-weight: 700; }
.close-body strong { color: var(--ink); font-weight: 700; }
.leaderboard {
  width: 100%;
}
.lb-row {
  display: flex; align-items: center; gap: 20px;
  padding: 16px 24px; margin-bottom: 10px;
  border: 3px solid var(--ink); background: #fff;
  position: relative;
}
.lb-row:nth-child(odd) { transform: rotate(-0.4deg); }
.lb-row:nth-child(even) { transform: rotate(0.4deg); }
.lb-row.first {
  background: var(--yellow);
  box-shadow: 4px 4px 0 var(--ink);
  transform: rotate(-1.2deg); z-index: 2;
}
.lb-rank {
  font-family: var(--display); font-size: 28px; font-weight: 400;
  color: var(--ink); min-width: 32px; text-align: left;
}
.lb-row.first .lb-rank { color: var(--red); }
.lb-name {
  font-family: var(--display); font-size: 28px; font-weight: 400;
  color: var(--ink); flex: 1; text-align: left; text-transform: uppercase;
}
.lb-score {
  font-family: var(--display); font-size: 44px; font-weight: 400;
  color: var(--ink); text-align: right; line-height: 0.9;
}
.lb-row.first .lb-score { color: var(--red); }
.rule { width: 36px; height: 3px; background: var(--ink); margin: 22px auto; }
.slide-accent-bar { display: none; }
.click-prompt { display: none !important; }

/* Scores slide — same paper backdrop, gets its own halftone wash */
.slide[data-type="scores"],
.slide[data-type="static"]#close-slide {
  background: var(--paper);
}
.slide[data-type="scores"]::before,
.slide[data-type="static"]#close-slide::before {
  content: ''; position: absolute; inset: 0;
  background-image: radial-gradient(var(--ink) 1.2px, transparent 1.4px);
  background-size: 9px 9px;
  opacity: 0.10; pointer-events: none;
}

/* ─────── PRESENTER MODE ─────── */
/* Presenter UI is only active during play. During picker/setup, the user uses the regular UI
   to choose an episode and enter contestants — even if an audience window is connected. */
#presenter-frame {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  display: none; z-index: 80;
  grid-template-columns: 1fr;
  grid-template-rows: 56px 44px 1fr;
  background: var(--bg);
}
body.presenter-mode.in-play #presenter-frame { display: grid; }


/* When the presenter UI is fully active (in-play): hide the regular deck/nav/hint */
body.presenter-mode.in-play #deck { display: none; }
body.presenter-mode.in-play #nav { display: none !important; }
body.presenter-mode.in-play #hint { display: none !important; }

/* During picker/setup with an audience connected: leave the deck visible so the host can interact,
   but show a small status banner indicating an audience is waiting. */
#audience-status {
  position: fixed; bottom: 22px; left: 70px;
  display: none; align-items: center; gap: 8px;
  padding: 7px 14px; background: var(--surface); border: 1px solid var(--border);
  border-left: 2px solid var(--accent);
  font-family: var(--mono); font-size: 11px; font-weight: 700;
  letter-spacing: 0.2em; text-transform: uppercase; color: var(--text);
  z-index: 110;
}
body.presenter-mode:not(.in-play) #audience-status { display: inline-flex; }
.audience-status-dot {
  width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  animation: aw-pulse 1.6s ease-in-out infinite;
}

#presenter-bar {
  grid-column: 1 / -1; grid-row: 1;
  display: flex; align-items: center; gap: 10px;
  padding: 0 18px; border-bottom: 1px solid var(--border);
  background: var(--surface);
  overflow-x: auto; overflow-y: hidden;
  scrollbar-width: thin;
  white-space: nowrap;
}
#presenter-bar > * { flex-shrink: 0; }
.pbar-title {
  font-family: var(--mono); font-size: 13px; font-weight: 800;
  letter-spacing: 0.3em; text-transform: uppercase; color: var(--text);
  margin-right: auto;
}
.pbar-title em { color: var(--accent); font-style: normal; margin-left: 6px; }
.pbar-progress {
  font-family: var(--mono); font-size: 12px;
  letter-spacing: 0.2em; color: var(--text-off); text-transform: uppercase;
  margin-right: 8px;
}
.pbar-btn {
  font-family: var(--mono); font-size: 12px; font-weight: 700;
  letter-spacing: 0.18em; text-transform: uppercase;
  padding: 7px 14px; border: 1px solid var(--border); background: var(--bg);
  color: var(--text); cursor: pointer; transition: all 0.15s;
}
.pbar-btn:hover { border-color: var(--border-bold); background: var(--surface-hover); }
.pbar-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.pbar-btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.pbar-btn.ghost { color: var(--text-muted); }
.pbar-btn[disabled] { opacity: 0.4; cursor: not-allowed; }

/* ── Tab strip ── */
#presenter-tabs {
  grid-column: 1; grid-row: 2;
  display: flex; align-items: stretch; gap: 0;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
  padding: 0 14px; overflow-x: auto; overflow-y: hidden;
}
.ptab {
  font-family: var(--mono); font-size: 12px; font-weight: 700;
  letter-spacing: 0.15em; text-transform: uppercase;
  padding: 0 18px; border: none; background: transparent;
  color: var(--text-muted); cursor: pointer;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px; /* sit on the strip border */
  transition: color 0.12s, border-color 0.12s;
  white-space: nowrap;
}
.ptab:hover { color: var(--text); }
.ptab.active { color: var(--accent); border-bottom-color: var(--accent); }
.ptab-shortcut-hint {
  margin-left: auto; display: flex; align-items: center;
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.18em; color: var(--text-muted); opacity: 0.5;
  padding-left: 10px; white-space: nowrap;
}

/* ── Panel container ── */
#presenter-body {
  grid-column: 1; grid-row: 3;
  position: relative; overflow: hidden;
}

/* All panels sit in the same grid cell, stacked */
.ppanel {
  position: absolute; inset: 0;
  display: none; overflow: hidden;
}
.ppanel.active { display: block; }

/* ── INFO panel ── */
#ppanel-info { overflow-y: auto; background: var(--surface); }
.ppanel-info-inner {
  display: flex; flex-direction: column;
  min-height: 100%;
}
.ppanel-section {
  padding: 18px 22px; border-bottom: 1px solid var(--border);
}
.ppanel-section-notes {
  flex: 1; border-bottom: none;
}
.ppanel-h {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent);
  font-weight: 800; margin-bottom: 12px;
}
.pside-host-notes {
  font-family: var(--serif); font-size: 24px;
  color: var(--text); line-height: 1.55; white-space: pre-wrap;
}
.pside-host-notes em { color: var(--accent); font-style: normal; }
.pside-host-notes:empty::before {
  content: '— no host notes —';
  color: var(--text-muted); font-style: italic;
}
.pside-meta {
  font-family: var(--serif); font-size: 20px;
  color: var(--text-off); line-height: 1.6;
}
.pside-meta strong { color: var(--text); font-weight: 700; }

/* ── AUDIENCE / NEXT panels (full-area slide preview) ── */
#ppanel-audience, #ppanel-next { background: var(--bg); }
.preview-slot { position: absolute; inset: 0; overflow: hidden; }
.preview-slot .slide {
  position: absolute !important; inset: auto !important;
  top: 0 !important; left: 0 !important; right: auto !important; bottom: auto !important;
  padding: 0 !important;
  opacity: 1 !important; pointer-events: none;
  transform-origin: top left;
  background: var(--bg);
}
.preview-slot .slide * { transition: none !important; }
.preview-slot .click-prompt { display: none !important; }

/* Scoreboard inside presenter sidebar (re-uses .sb-* styles below) */

/* ─────── SCOREBOARD STYLES (shared: presenter sidebar + scores slide) ─────── */
.sb-row {
  display: grid; grid-template-columns: 22px 1fr auto auto;
  align-items: center; gap: 8px;
  padding: 6px 10px; background: var(--bg);
  border: 1px solid var(--border);
  border-left: 2px solid var(--border-bold);
  margin-bottom: 4px;
}
.sb-row.leading { border-left-color: var(--accent); }
.sb-name {
  font-family: var(--mono); font-size: 14px;
  font-weight: 600; letter-spacing: 0.05em; color: var(--text-off);
  text-transform: uppercase; text-align: left;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.sb-row.leading .sb-name { color: var(--accent); }
.sb-pts {
  font-family: var(--mono); font-size: 18px;
  font-weight: 900; color: var(--text); min-width: 28px; text-align: right;
}
.sb-row.leading .sb-pts { color: var(--accent); }
.sb-btn {
  width: 22px; height: 22px; border: 1px solid var(--border); background: var(--bg);
  color: var(--text-muted); font-size: 16px; line-height: 1; cursor: pointer;
  border-radius: 2px; padding: 0; font-family: inherit;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.12s;
}
.sb-btn:hover { color: var(--text); border-color: var(--border-bold); background: var(--surface-hover); }
.sb-btn.minus { font-size: 18px; }
.sb-plus { color: var(--accent); }
.sb-plus:hover { background: var(--accent-tint); border-color: var(--accent); color: var(--accent); }

/* ─────── AUDIENCE MODE ─────── */
/* Slides fill viewport by default (inset: 0). Strip every UI affordance. */
body.audience-mode #nav { display: none !important; }
body.audience-mode #hint { display: none !important; }
body.audience-mode #studio { display: none !important; }
body.audience-mode .click-prompt { display: none !important; }
/* On audience side, hide the setup slide entirely — show a graceful waiting screen instead */
body.audience-mode .slide[data-type="setup"] { opacity: 0 !important; pointer-events: none; }
body.audience-mode .slide[data-type="picker"] { opacity: 0 !important; pointer-events: none; }
#audience-waiting {
  position: fixed; inset: 0;
  display: none; flex-direction: column;
  align-items: center; justify-content: center;
  background: var(--bg); color: var(--text-muted);
  font-family: var(--mono);
  font-size: 16px; letter-spacing: 0.3em; text-transform: uppercase;
  z-index: 60; gap: 14px;
}
body.audience-mode.audience-waiting #audience-waiting { display: flex; }
.audience-waiting-mark {
  font-family: var(--mono); font-size: clamp(64px, 12vw, 120px);
  font-weight: 900; color: var(--text); letter-spacing: -0.02em; line-height: 0.9;
}
.audience-waiting-mark span { color: var(--accent); }
.audience-waiting-pulse {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); margin-right: 8px;
  animation: aw-pulse 1.6s ease-in-out infinite;
}
@keyframes aw-pulse {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

/* ─────── STUDIO ─────── */
#studio {
  position: fixed; inset: 0; z-index: 500;
  background: var(--bg); color: var(--text);
  display: none; flex-direction: column;
  font-family: var(--serif); user-select: text;
  overflow: hidden;
}
#studio.visible { display: flex; }
.studio-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px; border-bottom: 1px solid var(--border);
  flex-shrink: 0; background: var(--surface);
}
.studio-title {
  font-family: var(--mono);
  font-size: 14px; font-weight: 800; letter-spacing: 0.4em;
  color: var(--text); text-transform: uppercase;
}
.studio-title em { color: var(--accent); font-style: normal; margin-left: 8px; }
.studio-actions { display: flex; gap: 10px; align-items: center; }
.studio-body { flex: 1; overflow-y: auto; padding: 24px; }
.studio-content { max-width: 1100px; margin: 0 auto; }

.studio-list-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 14px;
}
.studio-ep {
  border: 1px solid var(--border); background: var(--surface);
  padding: 16px 18px; display: flex; flex-direction: column; gap: 8px;
}
.studio-ep-title {
  font-family: var(--mono);
  font-size: 22px; font-weight: 800; color: var(--text);
  text-transform: uppercase; letter-spacing: 0.04em;
}
.studio-ep-meta {
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.25em; color: var(--text-muted); text-transform: uppercase;
}
.studio-ep-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }

.editor-header {
  display: flex; align-items: center; gap: 16px; margin-bottom: 24px;
  flex-wrap: wrap;
}
.editor-name-input {
  background: var(--input-bg); border: 1px solid var(--border); color: var(--text);
  font-family: var(--mono); font-size: 28px; font-weight: 800;
  padding: 10px 14px; outline: none; min-width: 280px; flex: 1;
  text-transform: uppercase; letter-spacing: 0.04em;
}
.editor-name-input:focus { border-color: var(--accent); }
.editor-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
.tab-btn {
  font-family: var(--mono); font-size: 13px; font-weight: 700;
  letter-spacing: 0.25em; text-transform: uppercase;
  padding: 12px 20px; background: transparent; border: none;
  color: var(--text-muted); cursor: pointer; border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}
.tab-btn:hover { color: var(--text-off); }
.tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
.tab-pane { display: none; }
.tab-pane.active { display: block; }

.field-grid { display: grid; grid-template-columns: 1fr; gap: 18px; max-width: 720px; }
.field-grid.cols-2 { grid-template-columns: 1fr 1fr; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label {
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.25em; color: var(--text-muted); text-transform: uppercase;
}
.field input, .field textarea, .field select {
  background: var(--input-bg); border: 1px solid var(--border); color: var(--text);
  font-family: var(--serif); font-size: 15px;
  padding: 10px 12px; outline: none; transition: border-color 0.15s;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
.field textarea { min-height: 70px; resize: vertical; }
.field-hint { font-size: 12px; color: var(--text-muted); }
.field-row { display: flex; align-items: center; gap: 10px; }
.field-row input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
.field-row label {
  font-family: var(--serif); font-size: 14px; color: var(--text);
  letter-spacing: normal; text-transform: none; margin: 0;
}
.section-h {
  font-family: var(--mono); font-size: 13px; font-weight: 800;
  letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent);
  margin: 28px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border);
}
.section-h:first-child { margin-top: 0; }

.q-tab-layout {
  display: grid; grid-template-columns: 320px 1fr;
  gap: 20px; align-items: start;
}
.q-list-wrap {
  border: 1px solid var(--border); background: var(--surface); padding: 12px;
  position: sticky; top: 0;
}
.q-list-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px;
}
.q-list-header h4 {
  font-family: var(--mono); font-size: 12px;
  letter-spacing: 0.3em; text-transform: uppercase; color: var(--text-off);
}
.q-list { display: flex; flex-direction: column; gap: 4px; max-height: calc(100vh - 240px); overflow-y: auto; }
.q-list-item {
  padding: 10px 12px; border: 1px solid var(--border); background: var(--surface-2);
  cursor: pointer; transition: all 0.12s;
  display: flex; align-items: center; gap: 8px;
}
.q-list-item:hover { border-color: var(--border-bold); }
.q-list-item.active { border-color: var(--accent); background: var(--accent-soft); }
.q-list-item.dragging { opacity: 0.4; }
.q-list-item.drag-over { border-top: 2px solid var(--accent); }
.q-grip {
  color: var(--text-muted); cursor: grab; font-size: 14px; line-height: 1; user-select: none;
}
.q-list-num {
  font-family: var(--mono); font-size: 11px;
  font-weight: 700; color: var(--text-muted); letter-spacing: 0.1em;
  min-width: 22px;
}
.q-list-text {
  flex: 1; font-size: 13px; color: var(--text);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.q-list-type {
  font-family: var(--mono); font-size: 9px;
  letter-spacing: 0.2em; color: var(--accent);
  text-transform: uppercase; padding: 2px 6px;
  border: 1px solid var(--accent);
}
.q-list-add { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.q-list-add .btn-sm { flex: 1; min-width: auto; }
.q-list-add-group { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.q-list-add-label {
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.3em; text-transform: uppercase; color: var(--text-muted);
  margin-bottom: 6px; font-weight: 700;
}
.q-list-item.is-content { background: var(--surface-2); }
.q-list-item.is-content .q-list-type { color: var(--text-muted); border-color: var(--border); }

.q-editor {
  border: 1px solid var(--border); background: var(--surface); padding: 24px;
}
.q-editor-empty {
  text-align: center; padding: 60px 20px; color: var(--text-muted);
  font-style: italic;
}
.q-editor-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
  flex-wrap: wrap; gap: 10px;
}
.q-type-pill {
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.25em; text-transform: uppercase; color: var(--accent);
  padding: 6px 12px; border: 1px solid var(--accent);
}
.option-row {
  display: grid; grid-template-columns: 1fr 100px auto;
  gap: 8px; align-items: center; margin-bottom: 8px;
}
.option-row input { width: 100%; }
.btn-x {
  background: transparent; border: 1px solid var(--border); color: var(--text-muted);
  width: 32px; height: 32px; cursor: pointer; padding: 0;
  font-size: 16px; line-height: 1;
}
.btn-x:hover { color: var(--text); border-color: var(--border-bold); }
.btn-add {
  background: transparent; border: 1px dashed var(--border); color: var(--text-off);
  font-family: var(--mono); font-size: 12px;
  letter-spacing: 0.15em; text-transform: uppercase;
  padding: 8px 14px; cursor: pointer; margin-top: 4px;
}
.btn-add:hover { color: var(--text); border-color: var(--border-bold); }

.logo-upload-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.logo-previews { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; max-width: 480px; }
.logo-preview {
  display: flex; align-items: center; justify-content: center;
  height: 100px; padding: 12px; border: 1px solid var(--border);
  position: relative;
}
.logo-preview.is-light { background: #fafaf7; }
.logo-preview.is-dark { background: #1a1a1a; }
.logo-preview img { max-width: 100%; max-height: 100%; object-fit: contain; }
.logo-preview-label {
  position: absolute; top: 6px; left: 8px;
  font-family: var(--mono); font-size: 9px;
  letter-spacing: 0.25em; text-transform: uppercase;
}
.logo-preview.is-light .logo-preview-label { color: #888; }
.logo-preview.is-dark .logo-preview-label { color: #888; }

/* Studio: contestant editor */
.contestant-edit-list {
  display: flex; flex-direction: column; gap: 14px; margin-bottom: 14px;
}
.ct-card {
  display: grid; grid-template-columns: 160px 1fr;
  gap: 20px; padding: 18px; border: 1px solid var(--border); background: var(--surface);
}
.ct-photo-col { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.ct-photo {
  width: 140px; height: 140px;
  object-fit: cover; border-radius: 50%;
  background: var(--surface-2); border: 1px solid var(--border);
  display: block;
}
.ct-photo-empty {
  display: flex; align-items: center; justify-content: center;
  color: var(--text-subtle);
}
.ct-photo-empty svg { width: 50%; height: 50%; }
.ct-photo-actions { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.ct-photo-actions .btn { width: 100%; padding: 6px 8px; font-size: 11px; }
.ct-fields { display: flex; flex-direction: column; }
.ct-row-actions { display: flex; gap: 8px; margin-top: 14px; align-items: center; }

/* ─────── PROMO IMAGE TEMPLATES (rendered offscreen for export) ─────── */
/* These render at fixed pixel dimensions. The host element gets `position: fixed; left: -9999px;`
   so users never see them; html2canvas captures them at full size, then they're removed. */
.promo {
  position: relative;
  overflow: hidden;
  background: var(--paper);
  font-family: var(--serif);
  color: var(--ink);
  /* Halftone backdrop matches the show */
}
.promo::before {
  content: ''; position: absolute; inset: 0;
  background-image: radial-gradient(var(--ink) 1.4px, transparent 1.6px);
  background-size: 12px 12px;
  opacity: 0.14; pointer-events: none;
  z-index: 1;
}
.promo::after {
  content: ''; position: absolute; inset: 0;
  background-image: radial-gradient(var(--red) 1.4px, transparent 1.6px);
  background-size: 18px 18px;
  opacity: 0.22; pointer-events: none;
  z-index: 1;
  mix-blend-mode: multiply;
}
.promo-spark {
  position: absolute;
  font-family: var(--display);
  color: var(--red);
  pointer-events: none;
  z-index: 3;
}
.promo-tape {
  position: absolute;
  background: rgba(245,233,74,0.85);
  border: 0.5px solid rgba(0,0,0,0.20);
  pointer-events: none;
  z-index: 5;
}
.promo-band {
  position: absolute;
  background: var(--ink);
  display: flex; align-items: center; justify-content: center;
  z-index: 4;
  /* Torn-paper top edge to match the title slide */
  clip-path: polygon(
    0 22%, 3% 12%, 7% 26%, 12% 14%, 17% 28%, 22% 10%, 27% 24%,
    32% 14%, 38% 27%, 43% 12%, 48% 25%, 53% 16%, 58% 28%, 63% 14%,
    68% 26%, 73% 12%, 78% 27%, 83% 16%, 88% 26%, 93% 14%, 100% 22%,
    100% 100%, 0 100%
  );
}
.promo-band-text {
  font-family: var(--mono);
  letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--yellow);
  margin-top: 12px;
}
.promo-wordmark {
  font-family: var(--display);
  font-weight: 400;
  letter-spacing: -0.02em;
  line-height: 0.85; color: var(--ink);
  position: relative; z-index: 4;
  text-align: center;
}
.promo-wordmark .splat {
  display: inline-block;
  background: var(--red);
  color: var(--yellow);
  padding: 0 0.08em;
  transform: rotate(-3deg) skewX(-4deg);
  margin: 0 -0.04em;
}
.promo-episode-title {
  font-family: var(--serif); font-style: italic; font-weight: 900;
  color: var(--ink);
  text-align: center;
  letter-spacing: -0.02em;
  line-height: 1.05;
  position: relative; z-index: 4;
}
.promo-contestants {
  display: flex; align-items: flex-end; justify-content: center;
  position: relative; z-index: 4;
}
.promo-contestant {
  display: flex; flex-direction: column; align-items: center;
  position: relative;
}
.promo-contestant-photo-wrap { position: relative; }
.promo-contestant-photo {
  object-fit: cover;
  border: 4px solid var(--ink);
  background: var(--paper-2);
  display: block;
  position: relative;
  border-radius: 50%;
}
.promo-contestant-photo-empty {
  display: flex; align-items: center; justify-content: center;
  background: var(--paper-2);
  color: var(--text-subtle);
  border-radius: 50%;
  border: 4px solid var(--ink);
}
.promo-contestant-photo-empty svg { width: 50%; height: 50%; }
.promo-contestant-name {
  font-family: var(--display); font-weight: 400;
  color: var(--ink); text-transform: uppercase;
  letter-spacing: -0.01em; line-height: 0.9;
  text-align: center;
}
.promo-vs {
  font-family: var(--display); font-weight: 400;
  color: var(--red); transform: rotate(-6deg);
}

/* === SQUARE 1080×1080 === */
.promo.square {
  width: 1080px; height: 1080px;
  padding: 100px 80px;
  display: flex; flex-direction: column;
}
.promo.square .promo-spark.tl { top: 38px; left: 60px; font-size: 96px; transform: rotate(-12deg); }

<script>
// ╔════════════════════════════════════════════════╗
// ║ DEMO EPISODE                                   ║
// ╚════════════════════════════════════════════════╝
const DEMO_EPISODE = {
  id: 'demo',
  name: 'Demo Episode',
  isDemo: true,
  framing: {

    logoUrl: null,
    tagline: 'Digging into the data nobody else bothered to.',
    closeTitle: 'One honest<br><em>mirror.</em>',

  },
  contestants: [
    { id: 'c1', name: 'Marco', subtext: 'Self-proclaimed pollster. Wrong about almost everything.', photoUrl: null },
    { id: 'c2', name: 'Aisha', subtext: 'Reads three newspapers a day. Will hear none of it.', photoUrl: null }
  ],
  questions: [
    { id: 'q1', type: 'two_choice', text: 'People who say they have…', options: [{ text: 'At least one close friend', pct: 79 }, { text: 'No close friends', pct: 21 }], correct: 0 },
    { id: 'q2', type: 'over_under', text: "What percentage of people say they don't get enough sleep?", number: 40, correct: 'over', actual: 42, note: 'It\'s <strong>~42%</strong> — nearly half running on empty.' },
    { id: 'q3', type: 'two_choice', text: 'People who…', options: [{ text: "Don't exercise regularly", pct: 53 }, { text: 'Exercise regularly', pct: 47 }], correct: 0 },
    { id: 'q4', type: 'two_choice', text: 'People who think social media is…', options: [{ text: 'Harmful to society', pct: 64 }, { text: 'Good for society', pct: 36 }], correct: 0 },
    { id: 'q5', type: 'two_choice', text: 'What determines success?', options: [{ text: 'Hard work', pct: 70 }, { text: 'Luck', pct: 30 }], correct: 0 },
    { id: 'q6', type: 'over_under', text: 'People who say they feel stressed about money', number: 60, correct: 'over', actual: 64, note: "It's <strong>~64%</strong> — nearly two in three." },
    { id: 'q7', type: 'two_choice', text: 'What changes things more?', options: [{ text: 'Individual effort', pct: 61 }, { text: 'Changing the system', pct: 39 }], correct: 0 },
    { id: 'q8', type: 'two_choice', text: 'People who feel…', options: [{ text: 'Misunderstood', pct: 52 }, { text: 'Understood', pct: 48 }], correct: 0 }
  ]
};

const BLANK_FRAMING = () => ({
  title: 'NON-CENSUS',
  logoUrl: null,
  tagline: 'Digging into the data nobody else bothered to.',
  closeTitle: 'Final Results.', closeBody: ''
});

const BLANK_CONTESTANTS = () => ([
  { id: 'c_' + Math.random().toString(36).slice(2, 7), name: '', subtext: '', photoUrl: null },
  { id: 'c_' + Math.random().toString(36).slice(2, 7), name: '', subtext: '', photoUrl: null }
]);

// ╔════════════════════════════════════════════════╗
// ║ STORAGE                                        ║
// ╚════════════════════════════════════════════════╝
// ╔════════════════════════════════════════════════╗
// ║ GITHUB CLOUD SYNC                              ║
// ╚════════════════════════════════════════════════╝
const GH_TOKEN_KEY  = 'nonCensus.github.token';
const GH_REPO       = 'AdLangPa/Non-Census';
const GH_BRANCH     = 'main';
const GH_EP_PATH    = 'episodes';
const GH_API        = 'https://api.github.com';

function ghToken() { return localStorage.getItem(GH_TOKEN_KEY) || ''; }
function ghHeaders(isWrite) {
  const h = { 'Authorization': `token ${ghToken()}` };
  if (isWrite) h['Content-Type'] = 'application/json';
  return h;
}

// List all episode files in the repo
async function ghListEpisodes() {
  const r = await fetch(`${GH_API}/repos/${GH_REPO}/contents/${GH_EP_PATH}?ref=${GH_BRANCH}`, { headers: ghHeaders(false) });
  if (!r.ok) throw new Error(`GitHub ${r.status}: ${r.statusText}`);
  const files = await r.json();
  return files.filter(f => f.name.endsWith('.json') && f.name !== '.gitkeep');
}

// Load one episode from repo by filename
async function ghLoadEpisode(filename) {
  const r = await fetch(`${GH_API}/repos/${GH_REPO}/contents/${GH_EP_PATH}/${filename}?ref=${GH_BRANCH}`, { headers: ghHeaders(false) });
  if (!r.ok) throw new Error(`GitHub ${r.status}: ${r.statusText}`);
  const meta = await r.json();
  const content = atob(meta.content.replace(/\n/g,''));
  return { ep: JSON.parse(content), sha: meta.sha, filename };
}

// Save/update one episode to repo
async function ghSaveEpisode(ep, existingSha) {
  const filename = `${ep.id}.json`;
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(ep, null, 2))));
  const body = { message: `Update episode: ${ep.name}`, content, branch: GH_BRANCH };
  if (existingSha) body.sha = existingSha;
  const r = await fetch(`${GH_API}/repos/${GH_REPO}/contents/${GH_EP_PATH}/${filename}`, {
    method: 'PUT', headers: ghHeaders(true), body: JSON.stringify(body)
  });
  if (!r.ok) { const e = await r.json(); throw new Error(e.message || r.statusText); }
  return (await r.json()).content.sha;
}

// Delete an episode from repo
async function ghDeleteEpisode(filename, sha) {
  const r = await fetch(`${GH_API}/repos/${GH_REPO}/contents/${GH_EP_PATH}/${filename}`, {
    method: 'DELETE', headers: ghHeaders(true),
    body: JSON.stringify({ message: `Delete episode: ${filename}`, sha, branch: GH_BRANCH })
  });
  if (!r.ok) { const e = await r.json(); throw new Error(e.message || r.statusText); }
}

// SHA cache so we don't need a GET before every PUT
const ghShaCache = {};

// Push a local episode to GitHub (create or update)
async function ghPushEpisode(ep) {
  const filename = `${ep.id}.json`;
  // Try to get current SHA if we don't have it cached
  if (!ghShaCache[filename]) {
    try {
      const r = await fetch(`${GH_API}/repos/${GH_REPO}/contents/${GH_EP_PATH}/${filename}`, { headers: ghHeaders() });
      if (r.ok) { const m = await r.json(); ghShaCache[filename] = m.sha; }
    } catch(e) { /* new file, no sha needed */ }
  }
  const newSha = await ghSaveEpisode(ep, ghShaCache[filename]);
  ghShaCache[filename] = newSha;
  return newSha;
}

// Show the GitHub cloud modal
function showCloudModal() {
  const hasToken = !!ghToken();
  const overlay = document.createElement('div');
  overlay.id = 'cloud-overlay';
  overlay.innerHTML = `
    <div id="cloud-modal">
      <div id="cloud-modal-title">☁ Cloud Sync</div>
      <div id="cloud-modal-body">
        ${!hasToken ? `
          <p style="margin-bottom:12px;">Enter your GitHub token to sync episodes across devices.</p>
          <div class="field">
            <label>GitHub Token</label>
            <input id="cloud-token-input" type="password" placeholder="github_pat_..." style="font-family:var(--mono); font-size:12px;">
          </div>
          <div style="display:flex; gap:8px; margin-top:12px;">
            <button class="btn" id="cloud-save-token">Connect</button>
            <button class="btn" id="cloud-cancel">Cancel</button>
          </div>
        ` : `
          <div id="cloud-status" style="font-family:var(--mono); font-size:12px; color:var(--text-muted); margin-bottom:12px;">Loading episodes from GitHub…</div>
          <div id="cloud-ep-list" style="margin-bottom:14px;"></div>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn" id="cloud-push-all">↑ Push All Local</button>
            <button class="btn" id="cloud-refresh">↻ Refresh</button>
            <button class="btn btn-danger" id="cloud-disconnect">Disconnect</button>
            <button class="btn" id="cloud-cancel">Close</button>
          </div>
        `}
      </div>
    </div>`;
  document.body.appendChild(overlay);

  overlay.addEventListener('click', e => { if (e.target === overlay) closeCloudModal(); });
  document.getElementById('cloud-cancel').addEventListener('click', closeCloudModal);

  if (!hasToken) {
    document.getElementById('cloud-save-token').addEventListener('click', async () => {
      const t = document.getElementById('cloud-token-input').value.trim();
      if (!t) return;
      const st = document.getElementById('cloud-modal-body');
      st.innerHTML = `<p style="font-family:var(--mono); font-size:12px;">Saving token…</p>`;
      // Save immediately — don't block on verification
      localStorage.setItem(GH_TOKEN_KEY, t);
      // Verify in background
      try {
        const r = await fetch(`${GH_API}/repos/${GH_REPO}`, { headers: { 'Authorization': `token ${t}` } });        if (!r.ok) {
          localStorage.removeItem(GH_TOKEN_KEY);
          throw new Error(`Token rejected by GitHub (${r.status}). Check the token has Contents read/write permission on AdLangPa/Non-Census.`);
        }
        closeCloudModal();
        showCloudModal();
      } catch(e) {
        localStorage.removeItem(GH_TOKEN_KEY);
        st.innerHTML = `<p style="color:var(--red); margin-bottom:10px; font-size:12px;">${e.message}</p>
          <button class="btn" id="cloud-retry">Try again</button>`;
        document.getElementById('cloud-retry').addEventListener('click', () => { closeCloudModal(); showCloudModal(); });
      }
    });
  } else {
    document.getElementById('cloud-disconnect').addEventListener('click', () => {
      localStorage.removeItem(GH_TOKEN_KEY);
      closeCloudModal();
      showPicker();
    });
    document.getElementById('cloud-push-all').addEventListener('click', async () => {
      const status = document.getElementById('cloud-status');
      const eps = loadEpisodes().filter(e => !e.isDemo);
      if (!eps.length) { status.textContent = 'No local episodes to push.'; return; }
      status.textContent = `Pushing ${eps.length} episode(s)…`;
      let ok = 0;
      for (const ep of eps) {
        try { await ghPushEpisode(ep); ok++; } catch(e) { status.textContent = `Error: ${e.message}`; return; }
      }
      status.textContent = `✓ Pushed ${ok} episode(s) to GitHub.`;
      await refreshCloudList();
    });
    document.getElementById('cloud-refresh').addEventListener('click', refreshCloudList);
    refreshCloudList();
  }
}

async function refreshCloudList() {
  const status = document.getElementById('cloud-status');
  const list = document.getElementById('cloud-ep-list');
  if (!status || !list) return;
  status.textContent = 'Loading…';
  try {
    const files = await ghListEpisodes();
    if (!files.length) { list.innerHTML = '<p style="font-size:13px; color:var(--text-muted);">No episodes in GitHub yet.</p>'; status.textContent = ''; return; }
    const localIds = new Set(loadEpisodes().map(e => e.id));
    list.innerHTML = files.map(f => {
      const id = f.name.replace('.json','');
      const hasLocal = localIds.has(id);
      return `<div class="cloud-ep-row">
        <span class="cloud-ep-name">${escHtml(f.name)}</span>
        <span class="cloud-ep-badge ${hasLocal ? 'local' : 'cloud-only'}">${hasLocal ? 'local + cloud' : 'cloud only'}</span>
        <button class="btn btn-sm cloud-pull-btn" data-file="${escHtml(f.name)}">↓ Pull</button>
      </div>`;
    }).join('');
    list.querySelectorAll('.cloud-pull-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        btn.textContent = '…';
        try {
          const { ep } = await ghLoadEpisode(btn.dataset.file);
          const migrated = migrateEpisode(ep);
          const existing = getEpisode(migrated.id);
          if (existing) {
            upsertEpisode(migrated);
            btn.textContent = '✓ Updated';
          } else {
            upsertEpisode(migrated);
            btn.textContent = '✓ Imported';
          }
          await refreshCloudList();
          showPicker();
        } catch(e) { btn.textContent = 'Error'; alert(e.message); }
      });
    });
    status.textContent = `${files.length} episode(s) on GitHub.`;
  } catch(e) { status.textContent = `Error: ${e.message}`; list.innerHTML = ''; }
}

function upsertEpisode(ep) {
  const eps = loadEpisodes();
  const idx = eps.findIndex(e => e.id === ep.id);
  if (idx >= 0) eps[idx] = ep; else eps.push(ep);
  saveEpisodes(eps);
  ghAutoPush(ep); // silently push to GitHub if connected
}

function closeCloudModal() {
  const el = document.getElementById('cloud-overlay');
  if (el) el.remove();
}

// Auto-push to GitHub after every save if token is present
async function ghAutoPush(ep) {
  if (!ghToken() || ep.isDemo) return;
  try { await ghPushEpisode(ep); } catch(e) { console.warn('Cloud push failed:', e.message); }
}

const STORAGE_KEY = 'nonCensus.episodes.v1';

function loadEpisodes() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveEpisodes(eps) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(eps)); } catch (e) { alert('Failed to save: ' + e.message); }
}
function getEpisode(id) {
  if (id === 'demo') return DEMO_EPISODE;
  return loadEpisodes().find(e => e.id === id);
}
function deleteEpisode(id) {
  saveEpisodes(loadEpisodes().filter(e => e.id !== id));
}
function newEpisodeId() { return 'ep_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 6); }

// Migrate any older episodes that still have a `rounds` array or `round` fields on questions
function migrateEpisode(ep) {
  if (!ep) return ep;
  if (ep.rounds) delete ep.rounds;
  if (ep.framing && 'showRoundMap' in ep.framing) delete ep.framing.showRoundMap;
  if (ep.framing && 'titleSplit' in ep.framing) delete ep.framing.titleSplit;
  if (ep.framing && 'showFormats' in ep.framing) delete ep.framing.showFormats;
  // Strip removed concept-slide fields
  if (ep.framing && 'concept' in ep.framing) delete ep.framing.concept;
  if (ep.framing && 'conceptBody' in ep.framing) delete ep.framing.conceptBody;
  if (Array.isArray(ep.questions)) ep.questions.forEach(q => {
    if ('round' in q) delete q.round;
    if ('label' in q) delete q.label;
  });
  // Ensure contestants array exists; preserve any existing data
  if (!Array.isArray(ep.contestants)) ep.contestants = [];
  // Each contestant needs an id, name, subtext, photoUrl
  ep.contestants = ep.contestants.map(c => ({
    id: c.id || ('c_' + Math.random().toString(36).slice(2, 7)),
    name: c.name || '',
    subtext: c.subtext || '',
    photoUrl: c.photoUrl || null,
  }));
  return ep;
}
